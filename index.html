    <!-- ========================================================================
         APPLICATION SCRIPT LOGIC (Alpine.js dartApp)
         Implements game state management, turn calculations, rules enforcement,
         checkouts, and undo history across all supported dart games.
         ======================================================================== -->
    <script>
        function dartApp() {
            return {
                /* ------------------------------------------------------------------
                   APPLICATION STATE PROPERTIES
                   ------------------------------------------------------------------ */
                screen: 'menu',                    // Current screen: 'menu' (setup) or 'scoring' (live match)
                gameMode: '501',                   // Selected game mode ('501', '301', 'Cricket', 'BowTie', etc.)
                startingMode: 'Straight-in',       // X01 starting rule ('Straight-in' or 'Double-in')
                matchType: 'Single Leg',           // Match structure type
                playerCount: 2,                    // Number of active players
                activePlayer: 0,                   // Index of the player whose turn it currently is
                currentTurnScore: '',              // Active turn score expression for X01 (e.g. '20*3 + 19')
                bowTieRoundIndex: 0,               // Current active round index in BowTie (0 to 11)
                bowTieDarts: [],                   // Recorded darts thrown in the current BowTie round
                bowTieRoundInput: '',              // Text expression for BowTie round score
                bowTieMessage: '',                 // Validation / alert message for BowTie (e.g. max score 180)
                cricketHitLimitMessage: '',        // Alert message for Cricket (closed target or 3-dart limit)
                x01BustMessage: '',                // Alert message for X01 (Bust or max score 180)
                players: [                         // List of player state objects
                    { name: 'P1', score: 501, history: [], cricketScore: 0, marks: {20:0, 19:0, 18:0, 17:0, 16:0, 15:0, 'B':0}, turnDarts: 0, bowTieScore: 0 },
                    { name: 'P2', score: 501, history: [], cricketScore: 0, marks: {20:0, 19:0, 18:0, 17:0, 16:0, 15:0, 'B':0}, turnDarts: 0, bowTieScore: 0 }
                ],
                lastTurn: null,                    // Details of the most recent completed turn
                undoStack: [],                     // Stack of game state snapshots for multi-level undo

                /* ------------------------------------------------------------------
                   UNDO & STATE PERSISTENCE METHODS
                   ------------------------------------------------------------------ */
                /**
                 * Captures a snapshot of the current game state and pushes it onto the undo stack.
                 */
                saveUndoState() {
                    this.undoStack.push({
                        screen: this.screen,
                        gameMode: this.gameMode,
                        startingMode: this.startingMode,
                        playerCount: this.playerCount,
                        activePlayer: this.activePlayer,
                        currentTurnScore: this.currentTurnScore,
                        bowTieRoundIndex: this.bowTieRoundIndex,
                        bowTieDarts: JSON.parse(JSON.stringify(this.bowTieDarts || [])),
                        bowTieRoundInput: this.bowTieRoundInput,
                        bowTieMessage: this.bowTieMessage,
                        cricketHitLimitMessage: this.cricketHitLimitMessage,
                        players: JSON.parse(JSON.stringify(this.players)),
                        lastTurn: this.lastTurn ? { ...this.lastTurn } : null
                    });
                },

                /**
                 * Restores the game state from a previously captured undo snapshot.
                 */
                restoreUndoState(snapshot) {
                    if (!snapshot) return;
                    this.screen = snapshot.screen;
                    this.gameMode = snapshot.gameMode;
                    this.startingMode = snapshot.startingMode || 'Straight-in';
                    this.playerCount = snapshot.playerCount;
                    this.activePlayer = snapshot.activePlayer;
                    this.currentTurnScore = snapshot.currentTurnScore;
                    this.bowTieRoundIndex = snapshot.bowTieRoundIndex ?? 0;
                    this.bowTieDarts = JSON.parse(JSON.stringify(snapshot.bowTieDarts || []));
                    this.bowTieRoundInput = snapshot.bowTieRoundInput || '';
                    this.bowTieMessage = snapshot.bowTieMessage || '';
                    this.cricketHitLimitMessage = snapshot.cricketHitLimitMessage || '';
                    this.players = JSON.parse(JSON.stringify(snapshot.players));
                    this.lastTurn = snapshot.lastTurn ? { ...snapshot.lastTurn } : null;
                },

                /**
                 * Creates an initial baseline snapshot for undo operations when a match starts.
                 */
                saveUndoStateSnapshot() {
                    return {
                        screen: this.screen,
                        gameMode: this.gameMode,
                        startingMode: this.startingMode,
                        playerCount: this.playerCount,
                        activePlayer: this.activePlayer,
                        currentTurnScore: this.currentTurnScore,
                        bowTieRoundIndex: this.bowTieRoundIndex ?? 0,
                        bowTieDarts: JSON.parse(JSON.stringify(this.bowTieDarts || [])),
                        bowTieRoundInput: this.bowTieRoundInput || '',
                        bowTieMessage: this.bowTieMessage || '',
                        cricketHitLimitMessage: this.cricketHitLimitMessage || '',
                        players: JSON.parse(JSON.stringify(this.players)),
                        lastTurn: this.lastTurn ? { ...this.lastTurn } : null
                    };
                },

                /**
                 * Reverts the most recent turn or dart hit and restores previous state.
                 */
                undo() {
                    if (this.undoStack.length <= 1) {
                        const base = this.undoStack[0] || this.saveUndoStateSnapshot();
                        this.restoreUndoState(base);
                        this.undoStack = [base];
                        return;
                    }

                    const previous = this.undoStack.pop();
                    this.restoreUndoState(previous);
                    // Clear any transient warning messages when undoing
                    this.cricketHitLimitMessage = '';
                    this.x01BustMessage = '';
                    this.bowTieMessage = '';
                },

                /* ------------------------------------------------------------------
                   GAME MODE PREDICATES & PLAYER CONFIGURATION
                   ------------------------------------------------------------------ */
                /** Check if current mode is either standard 2-player Cricket or 3-Way Cricket */
                isCricketGameMode() {
                    return this.isStandardCricketGameMode() || this.isThreeWayCricketGameMode();
                },

                /** Check if current mode is standard 2-player Cricket */
                isStandardCricketGameMode() {
                    return this.gameMode === 'Cricket';
                },

                /** Check if current mode is 3-Way Cricket */
                isThreeWayCricketGameMode() {
                    return this.gameMode === '3-Way Cricket';
                },

                /** Check if current mode is an X01 game (601, 501, 401, 301, 201, 101) */
                isX01GameMode() {
                    return ['601', '501', '401', '301', '201', '101'].includes(String(this.gameMode));
                },

                /** Check if current mode is BowTie */
                isBowTieGameMode() {
                    return this.gameMode === 'BowTie';
                },

                /** Returns maximum allowed players for the current game mode */
                getMaxPlayerCount() {
                    if (this.isBowTieGameMode()) return 15;
                    if (this.isX01GameMode()) return 4;
                    if (this.isThreeWayCricketGameMode()) return 3;
                    return 2;
                },

                /** Returns an array [1, 2, ..., max] for the player count selector */
                getPlayerCountOptions() {
                    const max = this.getMaxPlayerCount();
                    return Array.from({ length: max }, (_, index) => index + 1);
                },

                /** Returns array of player slot descriptor objects for the setup screen */
                getPlayerSlots() {
                    const count = this.isThreeWayCricketGameMode()
                        ? 3
                        : (this.isStandardCricketGameMode()
                            ? 2
                            : Math.min(this.getMaxPlayerCount(), Math.max(1, Number(this.playerCount) || 2)));
                    return Array.from({ length: count }, (_, index) => ({ 
                        index, 
                        name: this.players[index]?.name || `P${index + 1}` 
                    }));
                },

                /** CSS grid classes for player name inputs on setup screen */
                getPlayerNameSetupGridClasses() {
                    const count = this.getPlayerSlots().length;
                    if (count > 6) return 'grid-cols-4';
                    if (count === 3) return 'grid-cols-3';
                    if (count === 1) return 'grid-cols-1';
                    return 'grid-cols-2';
                },

                /** CSS grid classes for the live scoreboard header */
                getPlayerGridClasses() {
                    const count = this.players.length || this.playerCount || 2;
                    if (count <= 2) return 'grid-cols-2';
                    if (count === 3) return 'grid-cols-3';
                    if (count <= 4) return 'grid-cols-2';
                    if (count <= 6) return 'grid-cols-3';
                    return 'grid-cols-4';
                },

                /** Returns maximum allowed character length for player names */
                getPlayerNameMaxLength() {
                    if (this.isBowTieGameMode()) return 5;
                    return Number(this.playerCount) > 6 ? 2 : 5;
                },

                /**
                 * Sanitizes and updates a player's name during setup (uppercase, alphanumeric only).
                 */
                setPlayerName(index, value, event) {
                    const maxLength = this.getPlayerNameMaxLength();
                    const nextValue = String(value || '').replace(/[^A-Za-z0-9]/g, '').slice(0, maxLength).toUpperCase();
                    if (event && event.target) {
                        event.target.value = nextValue;
                    }
                    if (!this.players[index]) {
                        this.setupPlayerNames();
                    }
                    if (this.players[index]) {
                        this.players[index].name = nextValue;
                    }
                },

                /**
                 * Triggered when the user selects a new "Game Mode" on the setup screen.
                 * Sets the default number of players appropriate for the chosen mode,
                 * and resets Player Names back to their default values (P1, P2, etc.).
                 */
                handleGameModeChange() {
                    // Set default player count appropriate for selected mode
                    if (this.isThreeWayCricketGameMode()) {
                        this.playerCount = 3;
                    } else if (this.isStandardCricketGameMode()) {
                        this.playerCount = 2;
                    } else if (['201', '101'].includes(String(this.gameMode))) {
                        this.playerCount = 1;
                    } else if (this.isX01GameMode()) {
                        this.playerCount = 2;
                    } else if (this.isBowTieGameMode()) {
                        this.playerCount = 2;
                    }
                    // Reset player names back to defaults (P1, P2, P3, etc.)
                    this.setupPlayerNames(true);
                },

                /** Returns starting score for X01 modes (e.g. 501 for '501', 0 for others) */
                getStartingScore() {
                    return this.isX01GameMode() ? Number(this.gameMode) : 0;
                },

                /**
                 * Initializes or updates player objects according to the current mode and count.
                 * @param {boolean} resetToDefault - When true, resets names to default (P1, P2, ...)
                 */
                setupPlayerNames(resetToDefault = false) {
                    this.cricketHitLimitMessage = '';
                    const count = this.isThreeWayCricketGameMode()
                        ? 3
                        : (this.isStandardCricketGameMode()
                            ? 2
                            : Math.min(this.getMaxPlayerCount(), Math.max(1, Number(this.playerCount) || 2)));
                    const existingPlayers = Array.isArray(this.players) ? this.players : [];
                    this.players = Array.from({ length: count }, (_, index) => {
                        const existing = existingPlayers[index];
                        const defaultName = `P${index + 1}`;
                        // If resetToDefault is true, always reset to P1, P2, etc.
                        const name = (!resetToDefault && existing && existing.name && existing.name.trim())
                            ? existing.name.trim().slice(0, this.getPlayerNameMaxLength()).toUpperCase()
                            : defaultName;
                        return {
                            name: name,
                            score: this.isX01GameMode() ? Number(this.gameMode) : 0,
                            history: existing && !resetToDefault ? existing.history || [] : [],
                            cricketScore: existing && !resetToDefault ? existing.cricketScore || 0 : 0,
                            marks: existing && !resetToDefault && existing.marks ? { ...existing.marks } : {20:0, 19:0, 18:0, 17:0, 16:0, 15:0, 'B':0},
                            turnDarts: existing && !resetToDefault ? existing.turnDarts || 0 : 0,
                            bowTieScore: existing && !resetToDefault ? existing.bowTieScore || 0 : 0
                        };
                    });
                },

                /**
                 * Begins a new match with the configured players and initial scores.
                 */
                startMatch() {
                    const startingScore = this.getStartingScore();
                    this.setupPlayerNames(false);
                    this.players = this.players.map((player, index) => ({
                        ...player,
                        name: (player.name && player.name.trim()) ? player.name.trim().slice(0, this.getPlayerNameMaxLength()).toUpperCase() : `P${index + 1}`,
                        score: startingScore,
                        history: [],
                        cricketScore: 0,
                        marks: {20:0, 19:0, 18:0, 17:0, 16:0, 15:0, 'B':0},
                        turnDarts: 0,
                        bowTieScore: 0
                    }));
                    this.activePlayer = 0;
                    this.currentTurnScore = '';
                    this.bowTieRoundIndex = 0;
                    this.bowTieDarts = [];
                    this.bowTieRoundInput = '';
                    this.bowTieMessage = '';
                    this.cricketHitLimitMessage = '';
                    this.x01BustMessage = '';
                    this.screen = 'scoring';
                    this.undoStack = [this.saveUndoStateSnapshot()];
                },

                /**
                 * Returns back to the menu screen to configure a new match.
                 */
                resetMatch() {
                    this.screen = 'menu';
                    this.x01BustMessage = '';
                    this.bowTieMessage = '';
                    this.cricketHitLimitMessage = '';
                },

                /* ------------------------------------------------------------------
                   BOWTIE GAME RULES & SCORING ENGINE
                   ------------------------------------------------------------------ */
                /** Defines the 12 sequential rounds of BowTie */
                getBowTieRounds() {
                    return [
                        { key: 'free', label: 'Free', type: 'free' },
                        { key: '20', label: '20', type: 'target', target: 20 },
                        { key: '19', label: '19', type: 'target', target: 19 },
                        { key: 'treble', label: 'Treble (T)', type: 'anyTreble' },
                        { key: '18', label: '18', type: 'target', target: 18 },
                        { key: '17', label: '17', type: 'target', target: 17 },
                        { key: 'double', label: 'Double (D)', type: 'anyDouble' },
                        { key: '16', label: '16', type: 'target', target: 16 },
                        { key: '15', label: '15', type: 'target', target: 15 },
                        { key: '3color', label: '3 Color', type: 'threeColor' },
                        { key: 'bt', label: 'BowTie (BT)', type: 'bowtie' },
                        { key: 'bull', label: 'Bull (B)', type: 'bull' }
                    ];
                },

                /** Returns the round descriptor currently in progress */
                getCurrentBowTieRound() {
                    const rounds = this.getBowTieRounds();
                    return rounds[Math.min(this.bowTieRoundIndex || 0, rounds.length - 1)] || rounds[0];
                },

                /** Checks if a given target corresponds to the currently active BowTie round */
                isCurrentBowTieTarget(target) {
                    const active = this.getCurrentBowTieRound();
                    if (!active) return false;
                    const activeIndex = this.getBowTieRounds().findIndex((round) => round.key === active.key);
                    const targetIndex = this.getBowTieTargetIndex(target);
                    return activeIndex === targetIndex;
                },

                /** Returns index 0-11 for a target label in BowTie */
                getBowTieTargetIndex(target) {
                    const targets = [
                        'Free', 20, 19, 'Treble (T)', 18, 17, 'Double (D)',
                        16, 15, '3 Color', 'BowTie (BT)', 'Bull (B)'
                    ];
                    const token = String(target || '').trim();
                    return targets.findIndex((item) => String(item).trim() === token);
                },

                /** Splits players into rows of 4 for the BowTie scorecards grid */
                getBowTiePlayerRows() {
                    const rows = [];
                    for (let index = 0; index < this.players.length; index += 4) {
                        rows.push(this.players.slice(index, index + 4).map((player, offset) => ({
                            ...player,
                            index: index + offset
                        })));
                    }
                    return rows;
                },

                /** Appends a clicked target number to the BowTie round input */
                addBowTieRoundTarget(target) {
                    if (!this.isBowTieGameMode()) return;
                    this.bowTieMessage = '';
                    if (['Free', 'Treble (T)', 'Double (D)', '3 Color', 'BowTie (BT)'].includes(target)) return;

                    const normalizedTarget = typeof target === 'string' ? target.trim() : String(target);
                    const value = normalizedTarget === 'Bull (B)' || normalizedTarget === 'B' ? 25 : Number(normalizedTarget);
                    const current = (this.bowTieRoundInput || '').trim();
                    const token = normalizedTarget === 'Bull (B)' || normalizedTarget === 'B'
                        ? 'B'
                        : (normalizedTarget === 'Treble (T)' ? 'T' : (normalizedTarget === 'Double (D)' ? 'D' : (normalizedTarget === '3 Color' ? '3C' : (normalizedTarget === 'BT' ? 'BT' : (normalizedTarget === 'Free' ? 'FREE' : String(value))))));

                    this.bowTieRoundInput = current ? `${current} ${token}` : token;

                    if (Number.isFinite(value) && value > 0) {
                        this.bowTieDarts.push({
                            value,
                            multiplier: 1,
                            color: value === 25 ? 'green' : (value % 2 === 0 ? 'black' : 'red')
                        });
                    }
                },

                /** Clears the current round input and dart hits in BowTie */
                clearBowTieRoundInput() {
                    this.bowTieRoundInput = '';
                    this.bowTieDarts = [];
                    this.bowTieMessage = '';
                },

                /** Parses raw text input (e.g. '20 20 18' or 'T20 60') into structured dart objects */
                parseBowTieRoundInput() {
                    const raw = String(this.bowTieRoundInput || '').trim();
                    if (!raw) {
                        return this.bowTieDarts.slice();
                    }

                    const round = this.getCurrentBowTieRound();
                    const targetVal = round && (round.target !== undefined ? (round.target === 'B' ? 25 : Number(round.target)) : (round.type === 'bull' ? 25 : null));

                    return raw
                        .split(/[\s,+]+/)
                        .filter(Boolean)
                        .flatMap((token) => {
                            const normalized = token.toUpperCase().trim();
                            if (normalized === 'FREE') return [];
                            if (normalized === '3C' || normalized === '3-COLOR') return [];
                            if (normalized === 'BT') return [];
                            if (normalized === 'B' || normalized === 'BULL') return [{ value: 25, multiplier: 1, color: 'green' }];
                            if (normalized === 'T') return [];
                            if (normalized === 'D') return [];
                            if (normalized.startsWith('T')) return [{ value: Number(normalized.slice(1)) || 0, multiplier: 3, color: 'red' }];
                            if (normalized.startsWith('D')) return [{ value: Number(normalized.slice(1)) || 0, multiplier: 2, color: 'black' }];

                            if (/[*X]/.test(normalized)) {
                                const parts = normalized.split(/[*X]/).map((p) => p.trim());
                                if (parts.length === 2) {
                                    let val1 = parts[0] === 'B' ? 25 : Number(parts[0]);
                                    let val2 = parts[1] === 'B' ? 25 : Number(parts[1]);
                                    if (Number.isFinite(val1) && Number.isFinite(val2)) {
                                        if (val2 <= 3 && val1 > 3) {
                                            return [{ value: val1, multiplier: val2, color: val1 === 25 ? 'green' : (val1 % 2 === 0 ? 'black' : 'red') }];
                                        } else if (val1 <= 3 && val2 > 3) {
                                            return [{ value: val2, multiplier: val1, color: val2 === 25 ? 'green' : (val2 % 2 === 0 ? 'black' : 'red') }];
                                        } else {
                                            return [{ value: val1 * val2, multiplier: 1, color: 'red' }];
                                        }
                                    }
                                }
                            }

                            const value = Number(normalized);
                            if (!Number.isFinite(value) || value <= 0) return [];

                            if (targetVal && value !== targetVal && value % targetVal === 0 && (value / targetVal) <= 3) {
                                const mult = value / targetVal;
                                return [{
                                    value: targetVal,
                                    multiplier: mult,
                                    color: targetVal === 25 ? 'green' : (targetVal % 2 === 0 ? 'black' : 'red')
                                }];
                            }

                            return [{
                                value: value,
                                multiplier: 1,
                                color: value === 25 ? 'green' : (value % 2 === 0 ? 'black' : 'red')
                            }];
                        })
                        .filter((dart) => Number.isFinite(dart.value) && dart.value > 0);
                },

                /** Records a dart thrown in BowTie; auto-submits turn after 3 darts */
                bowTieAddDart(value, multiplier = 1) {
                    if (!this.isBowTieGameMode()) return;
                    this.bowTieDarts.push({ 
                        value: value === null ? 0 : Number(value), 
                        multiplier: Number(multiplier) || 0, 
                        color: value === null ? 'miss' : (value === 25 || value === 50 ? 'green' : (value % 2 === 0 ? 'black' : 'red')) 
                    });
                    if (this.bowTieDarts.length >= 3) {
                        this.submitBowTieTurn();
                    }
                },

                /** BowTie penalty rule: Halves player score (rounding up if odd) on missed target round */
                rollBowTiePenalty(player) {
                    const total = Number(player.bowTieScore || 0);
                    const adjusted = total % 2 === 1 ? total + 1 : total;
                    return Math.floor(adjusted / 2);
                },

                /** Resolves points scored or penalty applied for a BowTie round */
                resolveBowTieRound(player, round, darts) {
                    const current = Number(player.bowTieScore || 0);
                    const sumPoints = (items) => items.reduce((total, dart) => total + (Number(dart.value) || 0) * (Number(dart.multiplier) || 1), 0);

                    // Free Round: Any hits score points; no hits applies penalty
                    if (round.type === 'free') {
                        const hits = darts.filter((dart) => dart && Number(dart.value) > 0);
                        if (!hits.length) return this.rollBowTiePenalty(player);
                        return current + sumPoints(hits);
                    }

                    // Target Rounds (20, 19, 18, 17, 16, 15): Only specified target hits count
                    if (round.type === 'target') {
                        const hits = darts.filter((dart) => Number(dart.value) === Number(round.target));
                        if (!hits.length) return this.rollBowTiePenalty(player);
                        return current + sumPoints(hits);
                    }

                    // Special Rounds (Treble, Double, 3 Color, BowTie)
                    if (round.type === 'anyTreble' || round.type === 'anyDouble' || round.type === 'threeColor' || round.type === 'bowtie') {
                        const enteredPoints = darts.reduce((total, dart) => total + (Number(dart.value) || 0) * (Number(dart.multiplier) || 1), 0);
                        if (enteredPoints <= 0) return this.rollBowTiePenalty(player);
                        if (round.type === 'anyTreble' && enteredPoints % 3 !== 0) return this.rollBowTiePenalty(player);
                        if (round.type === 'anyDouble' && enteredPoints % 2 !== 0) return this.rollBowTiePenalty(player);
                        return current + enteredPoints;
                    }

                    // Bullseye Round: Only 25 (Single Bull) and 50 (Double Bull) count
                    if (round.type === 'bull') {
                        const hits = darts.filter((dart) => [25, 50].includes(Number(dart.value)));
                        if (!hits.length) return this.rollBowTiePenalty(player);
                        return current + sumPoints(hits);
                    }

                    return current;
                },

                /**
                 * Submits the active player's BowTie turn.
                 * Enforces the max score guard (> 180) across all games.
                 */
                submitBowTieTurn() {
                    if (!this.isBowTieGameMode()) return;
                    const player = this.players[this.activePlayer];
                    if (!player) return;

                    const round = this.getCurrentBowTieRound();
                    const darts = this.parseBowTieRoundInput();
                    const sumPoints = (items) => items.reduce((total, dart) => total + (Number(dart.value) || 0) * (Number(dart.multiplier) || 1), 0);
                    const enteredPoints = sumPoints(darts);

                    // Max score validation: A 3-dart turn score cannot exceed 180
                    if (enteredPoints > 180) {
                        this.bowTieMessage = 'The max score is 180, please correct the score and try ENTER again';
                        return;
                    }

                    this.bowTieMessage = '';
                    this.saveUndoState();
                    const trustedSpecialRound = ['anyTreble', 'anyDouble', 'threeColor', 'bowtie'].includes(round.type);

                    if (trustedSpecialRound) {
                        const trebleValid = round.type !== 'anyTreble' || enteredPoints % 3 === 0;
                        const doubleValid = round.type !== 'anyDouble' || enteredPoints % 2 === 0;

                        if (enteredPoints > 0 && trebleValid && doubleValid) {
                            player.bowTieScore = Number(player.bowTieScore || 0) + enteredPoints;
                        } else {
                            player.bowTieScore = this.rollBowTiePenalty(player);
                        }
                    } else {
                        player.bowTieScore = this.resolveBowTieRound(player, round, darts);
                    }

                    this.bowTieDarts = [];
                    this.bowTieRoundInput = '';
                    this.activePlayer = (this.activePlayer + 1) % this.players.length;
                    if (this.activePlayer === 0) {
                        this.bowTieRoundIndex += 1;
                    }

                    // Game over check when all 12 rounds are finished
                    if (this.bowTieRoundIndex >= this.getBowTieRounds().length) {
                        const winner = this.players.reduce((best, currentPlayer) => {
                            if (!best || Number(currentPlayer.bowTieScore) > Number(best.bowTieScore)) return currentPlayer;
                            return best;
                        }, null);
                        if (winner) {
                            alert(`${winner.name} wins BowTie with ${winner.bowTieScore} points!`);
                        }
                    }
                },

                /* ------------------------------------------------------------------
                   KEYPAD & TURN SCORING LOGIC (X01 & GENERAL)
                   ------------------------------------------------------------------ */
                /**
                 * Handles on-screen numeric keypad input (digits 0-9, backspace, operators +, *).
                 * Supports both BowTie and X01 active inputs.
                 */
                pressKey(val) {
                    if (this.isBowTieGameMode()) {
                        this.bowTieMessage = '';
                        if (val === 'back') {
                            this.bowTieRoundInput = (this.bowTieRoundInput || '').slice(0, -1);
                            return;
                        }

                        if (!/[0-9+*xX]/.test(val)) return;

                        const sanitized = (val.toLowerCase() === 'x' || val === '*') ? '*' : val;
                        const current = String(this.bowTieRoundInput || '');
                        const lastChar = current.slice(-1);

                        // Prevent invalid operator repetition
                        if (sanitized === '*') {
                            if (!current || /[+*]/.test(lastChar)) return;
                        } else if (sanitized === '+') {
                            if (!current || /[+*]/.test(lastChar)) return;
                        }

                        this.bowTieRoundInput = current + sanitized;
                        return;
                    }

                    // X01 Keypad Input Handling
                    if (val === 'back') {
                        this.currentTurnScore = this.currentTurnScore.slice(0, -1);
                        this.x01BustMessage = '';
                        return;
                    }

                    if (!/[0-9+*xX]/.test(val)) return;

                    const sanitized = val.toLowerCase() === 'x' ? '*' : val;
                    const current = this.currentTurnScore;
                    const lastChar = current.slice(-1);

                    if (sanitized === '*') {
                        if (!current || /[+*]/.test(lastChar)) return;
                    } else if (sanitized === '+') {
                        if (!current || /[+*]/.test(lastChar)) return;
                    } else {
                        if (current === '0' && sanitized === '0') return;
                    }

                    this.x01BustMessage = '';
                    this.currentTurnScore += sanitized;
                },

                /**
                 * Evaluates the active mathematical score expression (e.g. '20*3 + 19').
                 */
                evaluateTurnScore() {
                    const expr = this.currentTurnScore.replace(/x/gi, '*');
                    if (!expr) return 0;

                    try {
                        const value = Function(`"use strict"; return (${expr});`)();
                        if (!Number.isFinite(value)) return 0;
                        return Math.max(0, value);
                    } catch (error) {
                        return 0;
                    }
                },

                /** Computes turn total preview string for the score box */
                turnTotalPreview() {
                    const total = this.evaluateTurnScore();
                    return this.currentTurnScore ? total.toString() : '0';
                },

                /** Computes new remaining score preview for the active player, indicating 'Bust' if invalid */
                newScorePreview() {
                    if (!this.currentTurnScore) {
                        return this.players[this.activePlayer].score;
                    }

                    const total = this.evaluateTurnScore();
                    const next = this.players[this.activePlayer].score - total;
                    if (next < 0 || next === 1) {
                        return 'Bust';
                    }
                    return next;
                },

                /** Direct preset score submission (e.g. clicking 26, 41, 60, etc.) */
                setScore(num) {
                    this.currentTurnScore = num.toString();
                    this.submitX01();
                },

                /** Dedicated bust button action (submits 0 score) */
                bustTurn() {
                    this.currentTurnScore = '0';
                    this.submitX01();
                },

                /**
                 * Submits the active player's X01 turn score.
                 * Enforces the max score guard (> 180), bust rules, and leg win conditions.
                 */
                submitX01() {
                    let pts = this.evaluateTurnScore();
                    // Max score validation: A 3-dart turn score cannot exceed 180
                    if (pts > 180) {
                        this.x01BustMessage = 'The max score is 180, please correct the score and try ENTER again';
                        return;
                    }

                    this.saveUndoState();
                    const actingPlayer = this.activePlayer;
                    let p = this.players[actingPlayer];
                    
                    // Validate standard X01 Bust rules (score cannot drop below 0 or equal 1)
                    if (p.score - pts < 0 || p.score - pts === 1) {
                        pts = 0; // Turn scores 0 points on bust
                        this.x01BustMessage = 'You Busted....use UNDO to correct this if appropriate.';
                    } else {
                        this.x01BustMessage = '';
                    }

                    this.lastTurn = { player: actingPlayer, pts: pts };
                    p.history.push({ pts: pts, remaining: p.score - pts });
                    p.score -= pts;

                    // Leg Win Condition: Player reaches exactly 0
                    if (p.score === 0) {
                        alert(`${p.name} WINS THE LEG!`);
                        this.screen = 'menu';
                        return;
                    }

                    this.currentTurnScore = '';
                    this.activePlayer = (this.activePlayer + 1) % this.players.length;
                },

                /** Calculates 3-dart running average for an X01 player */
                getPlayerAvg(idx) {
                    let p = this.players[idx];
                    if (p.history.length === 0) return '0.00';
                    let totalPts = p.history.reduce((acc, curr) => acc + curr.pts, 0);
                    let avg = (totalPts / (p.history.length * 3)) * 3;
                    return avg.toFixed(2);
                },

                /* ------------------------------------------------------------------
                   X01 CHECKOUT SUGGESTION ENGINE
                   ------------------------------------------------------------------ */
                /** Returns checkout guidance object for the current preview score */
                checkoutInfo() {
                    return this.getCheckout(this.newScorePreview() === 'Bust' ? this.players[this.activePlayer].score : this.newScorePreview());
                },

                /** Calculates 2-dart and 3-dart double-finish routes for score <= 170 */
                getCheckout(score) {
                    const remaining = Number(score);
                    if (!Number.isFinite(remaining) || remaining <= 1 || remaining > 170) {
                        return { summary: 'Build Score', twoDart: '', threeDart: '' };
                    }

                    const throwOptions = [];
                    for (let n = 1; n <= 20; n++) {
                        throwOptions.push({ value: n, label: String(n) });
                        throwOptions.push({ value: n * 2, label: `D${n}` });
                        throwOptions.push({ value: n * 3, label: `T${n}` });
                    }
                    throwOptions.push({ value: 25, label: 'Bull' });
                    throwOptions.push({ value: 50, label: 'DBull' });
                    throwOptions.sort((a, b) => b.value - a.value);

                    const isValidFinish = (option) => {
                        if (!option) return false;
                        return option.label === 'DBull' || option.label.startsWith('D');
                    };

                    const priorityScore = (route) => {
                        const routeText = route.map((item) => item.label).join(' ');
                        if (remaining === 41) {
                            if (routeText === '1 D20') return 0;
                            if (routeText === '9 D16') return 1;
                        }

                        const total = route.reduce((sum, item) => sum + item.value, 0);
                        if ([40, 32, 16].includes(total) && route.length === 1) return 0;

                        const subtotal = route.slice(0, -1).reduce((sum, item) => sum + item.value, 0);
                        if ([40, 32, 16].includes(subtotal)) return 0;
                        return 1;
                    };

                    const findExactCheckout = (dartCount) => {
                        const matches = [];
                        const seen = new Set();

                        const search = (target, combo, depth) => {
                            if (depth === dartCount) {
                                if (target === 0 && combo.length === dartCount && isValidFinish(combo[combo.length - 1])) {
                                    const route = combo.map((t) => t.label);
                                    const key = route.join('-');
                                    if (!seen.has(key)) {
                                        seen.add(key);
                                        matches.push({ route: route.join(' '), throws: combo });
                                    }
                                }
                                return;
                            }

                            for (const option of throwOptions) {
                                const nextTarget = target - option.value;
                                if (nextTarget < 0) continue;

                                if (depth === dartCount - 1) {
                                    if (nextTarget === 0 && isValidFinish(option)) {
                                        const fullCombo = [...combo, option];
                                        const route = fullCombo.map((t) => t.label);
                                        const key = route.join('-');
                                        if (!seen.has(key)) {
                                            seen.add(key);
                                            matches.push({ route: route.join(' '), throws: fullCombo });
                                        }
                                    }
                                    continue;
                                }

                                search(nextTarget, [...combo, option], depth + 1);
                            }
                        };

                        search(remaining, [], 0);
                        return matches.sort((a, b) => {
                            const diff = priorityScore(a.throws) - priorityScore(b.throws);
                            if (diff !== 0) return diff;
                            return a.route.localeCompare(b.route);
                        }).map((match) => match.route);
                    };

                    const twoDart = findExactCheckout(2)[0] || '';
                    const threeDart = findExactCheckout(3)[0] || '';

                    if (twoDart && threeDart) {
                        return { summary: 'Checkout route', twoDart, threeDart };
                    }
                    if (twoDart) {
                        return { summary: '2-Dart checkout', twoDart, threeDart };
                    }
                    if (threeDart) {
                        return { summary: '3-Dart checkout', twoDart, threeDart };
                    }
                    return { summary: 'Standard route available', twoDart, threeDart };
                },

                /* ------------------------------------------------------------------
                   CRICKET GAME RULES & SCORING ENGINE
                   ------------------------------------------------------------------ */
                /**
                 * Converts numerical marks count into traditional Cricket mark glyphs:
                 * 0 = '-' (empty)
                 * 1 = '/' (single slash)
                 * 2 = 'X' (cross)
                 * 3+ = '⨷' (closed circle with cross)
                 */
                renderMarks(marks) {
                    if (marks === 0) return '-';
                    if (marks === 1) return '/';
                    if (marks === 2) return 'X';
                    return '⨷';
                },

                /** Returns extra points scored on an open number for Cricket */
                getCricketExtraScore(playerIndex, target) {
                    const player = this.players[playerIndex];
                    const otherIndex = playerIndex === 0 ? 1 : 0;
                    const playerMarks = player.marks[target] || 0;
                    const otherMarks = this.players[otherIndex].marks[target] || 0;
                    const targetValue = target === 'B' ? 25 : Number(target);

                    if (playerMarks < 3 || otherMarks >= 3) return '';

                    const extraMarks = Math.max(0, playerMarks - 3);
                    return extraMarks > 0 ? String(extraMarks * targetValue) : '';
                },

                /** Provides feedback string if a player scores a large number of hits */
                getCricketHitFeedback(playerIndex) {
                    const player = this.players[playerIndex];
                    const totalClosedMarks = [20, 19, 18, 17, 16, 15, 'B'].reduce((sum, target) => {
                        const closedIndexes = this.players
                            .map((candidate, index) => ((candidate.marks[target] || 0) >= 3 ? index : -1))
                            .filter((index) => index !== -1);

                        if (closedIndexes.length !== 1) return sum;
                        const winnerIndex = closedIndexes[0];
                        if (winnerIndex !== playerIndex) return sum;
                        return sum + (this.players[winnerIndex].marks[target] || 0);
                    }, 0);

                    const displayHits = Math.max(totalClosedMarks, player.turnDarts || 0);
                    if (displayHits > 4) return `${player.name}: ${displayHits} hits`;
                    return '';
                },

                /**
                 * Helper placeholder for Cricket scores. Points in Cricket are permanently accumulated
                 * on each valid hit in hitCricket() and restored directly via undo snapshots.
                 */
                recalcCricketScores() {
                    // Points are accumulated incrementally on each valid dart hit and preserved
                    // in undo snapshots so scores are never wiped out when opponents close targets.
                },

                /**
                 * Records a hit on a Cricket target for the active player.
                 * Enforces:
                 * 1. Closed-for-game check: If all players have closed the number, no points can be scored.
                 *    The click does NOT count as a dart and displays an alert in red font above UNDO and ENTER.
                 * 2. Turn darts limit check: A player cannot exceed 3 darts per turn.
                 * 3. Valid hit: Saves undo state, increments marks and turn darts.
                 * 4. Point Scoring: If at least one opponent has not closed the target (< 3 marks),
                 *    extra marks beyond 3 score points immediately. Points are never wiped out unless UNDO is pressed.
                 */
                hitCricket(playerIndex, target, multiplier) {
                    const p = this.players[playerIndex];
                    if (!p) return;

                    const otherPlayers = this.players.filter((_, idx) => idx !== playerIndex);
                    // In 3-Way Cricket, when a player has closed a number target, other players can NOT score on that target.
                    // Therefore, active player can only score points if NO other player has closed it (all opponents < 3 marks).
                    // In Standard 2-player Cricket, player scores if the opponent has < 3 marks.
                    const canScore = this.isThreeWayCricketGameMode()
                        ? otherPlayers.every((opp) => (opp.marks[target] || 0) < 3)
                        : otherPlayers.some((opp) => (opp.marks[target] || 0) < 3);

                    // 1. Closed target check:
                    // A target click cannot score points or add marks if:
                    // a) Every player in the match has at least 3 marks on this target (closed for the game), OR
                    // b) The active player already has >= 3 marks AND cannot score points on it
                    //    (e.g. in 3-Way Cricket another player has closed it).
                    // Instead of counting this click as a dart, notify the player above UNDO/ENTER in red font.
                    const isClosedForGame = this.players.length > 0 && this.players.every((player) => (player.marks[target] || 0) >= 3);
                    const isClosedForActivePlayer = (p.marks[target] || 0) >= 3 && !canScore;

                    if (isClosedForGame || isClosedForActivePlayer) {
                        this.cricketHitLimitMessage = `${target} is already closed, select UNDO or ENTER or another number to continue`;
                        return;
                    }

                    // 2. Turn darts limit check:
                    // A player can throw a maximum of 3 darts per turn.
                    if ((p.turnDarts || 0) >= 3) {
                        this.cricketHitLimitMessage = '3 dart hits recorded, click on UNDO or ENTER to continue';
                        return;
                    }

                    // 3. Valid dart hit:
                    // Clear previous warning message and save undo state
                    this.cricketHitLimitMessage = '';
                    this.saveUndoState();

                    const prevMarks = p.marks[target] || 0;
                    const newMarks = prevMarks + multiplier;
                    p.marks[target] = newMarks;
                    p.turnDarts = (p.turnDarts || 0) + 1;

                    // 4. Scoring logic (for ALL Cricket games):
                    // In Cricket, a player scores points for any marks earned beyond 3 IF scoring is permitted:
                    // - Standard Cricket: At least one opponent has not yet closed the target (< 3 marks).
                    // - 3-Way Cricket: When a player has closed a target, other players can NOT score on that target
                    //   (a player can only score points on extra hits if no other player has closed it).
                    // Once earned, points are permanently kept and NEVER wiped out when an opponent closes
                    // the target later. Scores are only rolled back when UNDO is clicked.
                    if (canScore) {
                        const prevScoringMarks = Math.max(0, prevMarks - 3);
                        const newScoringMarks = Math.max(0, newMarks - 3);
                        const newlyScoredMarks = newScoringMarks - prevScoringMarks;
                        if (newlyScoredMarks > 0) {
                            const targetValue = target === 'B' ? 25 : Number(target);
                            p.cricketScore = (Number(p.cricketScore) || 0) + (newlyScoredMarks * targetValue);
                        }
                    }
                },

                /** Records a missed dart in Cricket */
                missCricket() {
                    this.submitCricketTurn();
                },

                /**
                 * Submits the active player's Cricket turn.
                 * Saves undo state, clears messages, resets turn darts, and advances to the next player.
                 */
                submitCricketTurn() {
                    this.saveUndoState();
                    this.cricketHitLimitMessage = '';
                    const current = this.players[this.activePlayer];
                    if (current) current.turnDarts = 0;
                    this.activePlayer = (this.activePlayer + 1) % this.players.length;
                },

                /* ------------------------------------------------------------------
                   GEOMETRIC DARTBOARD SEGMENTS (Helper utilities for board graphics)
                   ------------------------------------------------------------------ */
                /** Converts polar coordinates (angle & radius) to Cartesian (x, y) */
                polarToCartesian(cx, cy, radius, angleDeg) {
                    const radians = (angleDeg - 90) * (Math.PI / 180);
                    return {
                        x: cx + radius * Math.cos(radians),
                        y: cy + radius * Math.sin(radians)
                    };
                },

                /** Generates SVG path string for an annular ring segment */
                describeRingSegment(cx, cy, innerR, outerR, startDeg, endDeg) {
                    const startOuter = this.polarToCartesian(cx, cy, outerR, startDeg);
                    const endOuter = this.polarToCartesian(cx, cy, outerR, endDeg);
                    const startInner = this.polarToCartesian(cx, cy, innerR, startDeg);
                    const endInner = this.polarToCartesian(cx, cy, innerR, endDeg);
                    return [
                        `M ${startOuter.x} ${startOuter.y}`,
                        `L ${endOuter.x} ${endOuter.y}`,
                        `L ${endInner.x} ${endInner.y}`,
                        `L ${startInner.x} ${startInner.y}`,
                        'Z'
                    ].join(' ');
                },

                /** Returns geometry descriptors for standard 20-segment dartboard */
                getDartboardSegments() {
                    const numbers = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
                    const cx = 210;
                    const cy = 210;
                    return numbers.map((value, index) => {
                        const startDeg = index * 18;
                        const endDeg = startDeg + 18;
                        const midDeg = (startDeg + endDeg) / 2;
                        const labelPos = this.polarToCartesian(cx, cy, 76, midDeg);
                        return {
                            value,
                            startDeg,
                            endDeg,
                            singlePath: this.describeRingSegment(cx, cy, 32, 66, startDeg, endDeg),
                            triplePath: this.describeRingSegment(cx, cy, 66, 83, startDeg, endDeg),
                            doublePath: this.describeRingSegment(cx, cy, 118, 138, startDeg, endDeg),
                            labelX: labelPos.x,
                            labelY: labelPos.y
                        };
                    });
                }
            };
        }
    </script>
