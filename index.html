<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dart Games">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <title>Dart Games - Scoreboard</title>
    <!-- Tailwind CSS CDN for reactive, responsive utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN for lightweight, reactive component state management -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        /* ==========================================================================
           RESPONSIVE VIEWPORT & TOUCH STYLES
           ========================================================================== */
        /* Prevent elastic bouncing/overscroll on mobile browsers and disable text selection */
        body { 
            overscroll-behavior-y: none; 
            -webkit-user-select: none; 
            user-select: none; 
            min-height: 100vh; 
            min-height: 100dvh; 
        html { zoom: 140%; }
        }

        /* Optimize touch response times on interactive elements */
        button, input, select { 
            touch-action: manipulation; 
        }

        /* Tactile feedback animation for on-screen numeric keypad buttons */
        .keypad-btn { 
            transition: transform 90ms ease; 
        }
        .keypad-btn:active { 
            transform: scale(0.95); 
        }

        /* Flash animation when a player's score changes, returning to yellow */
        @keyframes scoreFlash {
            0%, 100% { color: #facc15; transform: scale(1); }
            20%, 60% { color: #ffffff; transform: scale(1.18); text-shadow: 0 0 12px rgba(250, 204, 21, 0.9); }
            40%, 80% { color: #ef4444; transform: scale(1.08); }
        }
        .score-flash {
            animation: scoreFlash 0.9s ease-in-out;
        }

        /* Compact sizing overrides for mobile / small screen viewports */
        @media (max-width: 640px) {
            .game-board-area { padding: 0.5rem !important; }
            .compact-keypad { padding: 0.5rem !important; }
            .compact-keypad .keypad-btn { padding-top: 0.375rem !important; padding-bottom: 0.375rem !important; }
            .mobile-menu { padding: 1rem !important; justify-content: flex-start !important; }
            .mobile-menu h2 { margin-bottom: 0.75rem !important; }
            .mobile-menu select, .mobile-menu input { margin-bottom: 0.5rem !important; }
        }

        /* Compact vertical paddings for short viewports (landscape mobile, compact tablets) */
        @media (max-height: 700px) {
            .game-board-area { padding-top: 0.25rem !important; padding-bottom: 0.25rem !important; }
            .compact-keypad { padding-top: 0.375rem !important; padding-bottom: 0.375rem !important; }
            .compact-keypad .keypad-btn { padding-top: 0.25rem !important; padding-bottom: 0.25rem !important; }
        }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans text-lg h-screen h-[100dvh] flex flex-col overflow-hidden" x-data="dartApp()" x-init="initApp()">

    <!-- ========================================================================
         HEADER BAR
         Displays the current match mode / rules and quick navigation actions
         ======================================================================== -->
    <header class="bg-slate-800 border-b border-slate-700 px-3 sm:px-4 py-2.5 flex justify-between items-center gap-2 shrink-0">
        <div class="flex items-center space-x-3 min-w-0">
            <!-- Dynamic title: Shows mode and starting rules for X01, or game name for Cricket/BowTie/Shanghai (scaled by 20%) -->
            <h1 class="text-xl sm:text-2xl font-bold truncate" x-text="isX01GameMode() ? '🎯 ' + gameMode + ' - ' + startingMode : (isShanghaiGameMode() ? '🎯 Shanghai - Round ' + (shanghaiRoundIndex + 1) + ' (Target: ' + (shanghaiRoundIndex + 1) + ')' : '🎯 ' + gameMode)"></h1>
        </div>
        <div class="flex items-center space-x-1.5 sm:space-x-2 shrink-0">
            <!-- New Match Button: Navigates back to setup/menu screen to start a fresh game -->
            <button @click="resetMatch()" class="bg-red-600 hover:bg-red-500 text-xs sm:text-base px-2.5 py-1.5 sm:px-4 sm:py-2 rounded font-bold transition-colors shadow whitespace-nowrap">New Match</button>
            <!-- HELP Button: Opens README.html located in the same directory as this HTML file -->
            <a href="README.html" target="_blank" rel="noopener noreferrer" class="bg-yellow-500 hover:bg-yellow-400 text-slate-900 text-xs sm:text-base px-2.5 py-1.5 sm:px-4 sm:py-2 rounded font-bold transition-colors flex items-center justify-center no-underline border border-yellow-300 shadow whitespace-nowrap">HELP</a>
            <!-- Reload Button: Reloads index.html from the web -->
            <button @click="reloadPage()" class="bg-sky-400 hover:bg-sky-300 text-slate-900 text-xs sm:text-base px-2.5 py-1.5 sm:px-4 sm:py-2 rounded font-bold transition-colors border border-sky-200 shadow whitespace-nowrap">Reload</button>
            <!-- Exit Button: Exits full screen mode -->
            <button data-exit-fullscreen @click="exitFullscreenMode()" class="bg-orange-500 hover:bg-orange-400 text-white text-xs sm:text-base px-2.5 py-1.5 sm:px-4 sm:py-2 rounded font-bold transition-colors border border-orange-300 shadow whitespace-nowrap">Exit</button>
        </div>
    </header>

    <!-- Full-Screen Prompt Pop-up for Mobile (Apple & Android) and iPad -->
    <div x-show="showFullscreenPopup" x-cloak class="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-600 rounded-2xl max-w-sm w-full p-5 shadow-2xl text-center space-y-4">
            <h2 class="text-xl font-black text-white">Use Full Screen</h2>
            <template x-if="canUseFullscreenApi() && !fullscreenBlockedFallback">
                <div class="space-y-4">
                    <p class="text-sm text-slate-300">Hide browser tabs and control bars so the complete screen is used by the app.</p>
                    <div class="flex flex-col gap-2">
                        <button @click="confirmEnterFullscreen()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-4 rounded-xl text-base shadow transition-colors">Enter Full Screen</button>
                        <button data-exit-fullscreen @click="dismissFullscreenPopup()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold py-2.5 px-4 rounded-xl text-sm transition-colors">Not Now</button>
                    </div>
                </div>
            </template>
            <template x-if="!canUseFullscreenApi() || fullscreenBlockedFallback">
                <div class="space-y-4 text-left">
                    <p class="text-sm text-slate-300 text-center">To hide Safari&rsquo;s tabs and control bars on this device and use the complete screen:</p>
                    <ol class="text-sm text-slate-200 space-y-2 list-decimal list-inside bg-slate-900/70 rounded-xl p-3 border border-slate-700">
                        <li>Tap the <span class="font-bold text-white">Share</span> button in your browser toolbar.</li>
                        <li>Tap <span class="font-bold text-white">Add to Home Screen</span>, then open <span class="font-bold text-white">Dart Games</span> from your Home Screen.</li>
                    </ol>
                    <button data-exit-fullscreen @click="dismissFullscreenPopup()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-4 rounded-xl text-base shadow transition-colors">Got It</button>
                </div>
            </template>
        </div>
    </div>

    <!-- ========================================================================
         MAIN CONTAINER
         Houses either the Setup/Menu view or the active Live Scoring interface
         ======================================================================== -->
    <main class="flex-1 flex flex-col overflow-hidden relative">

        <!-- ====================================================================
             1. SETUP / MENU SCREEN (screen === 'menu')
             Allows players to configure Game Mode, Starting In rules, Player Count,
             and customize Player Names before starting the match.
             ==================================================================== -->
        <div x-show="screen === 'menu'" class="mobile-menu absolute inset-0 bg-slate-900 z-20 p-6 flex flex-col justify-center max-w-md mx-auto w-full overflow-y-auto">
            <h2 class="text-[33.6px] font-black mb-6 text-center text-red-500 tracking-wider">DART GAMES</h2>
            
            <!-- Game Mode Selector: X01 (101-601), Standard Cricket, 3-Way Cricket, BowTie, Shanghai -->
            <label class="text-[19.6px] text-slate-400 mb-1">Game Mode</label>
            <select x-model="gameMode" @change="handleGameModeChange()" class="bg-slate-800 border border-slate-700 rounded p-3 mb-4 text-[25.2px] text-white font-bold focus:border-red-500 outline-none">
                <option value="601">601</option>
                <option value="501">501</option>
                <option value="401">401</option>
                <option value="301">301</option>
                <option value="201">201</option>
                <option value="101">101</option>
                <option value="Cricket">Standard Cricket</option>
                <option value="3-Way Cricket">3-Way Cricket</option>
                <option value="BowTie">BowTie</option>
                <option value="Shanghai">Shanghai</option>
            </select>

            <!-- Starting Mode Selector (Straight-in vs Double-in) for X01 game modes -->
            <template x-if="isX01GameMode()">
                <div>
                    <label class="text-[19.6px] text-slate-400 mb-1">Starting Mode</label>
                    <select x-model="startingMode" class="bg-slate-800 border border-slate-700 rounded p-3 mb-4 text-[25.2px] text-white font-bold w-full focus:border-red-500 outline-none">
                        <option value="Straight-in">Straight-in</option>
                        <option value="Double-in">Double-in</option>
                    </select>
                </div>
            </template>

            <!-- Player Count Selector for games supporting variable counts (X01: 1-4, BowTie: 1-15, Shanghai: 1-15) -->
            <template x-if="isX01GameMode() || isBowTieGameMode() || isShanghaiGameMode()">
                <div>
                    <label class="text-[19.6px] text-slate-400 mb-1">Players</label>
                    <select x-model="playerCount" @change="setupPlayerNames(false)" class="bg-slate-800 border border-slate-700 rounded p-3 mb-4 text-[25.2px] text-white font-bold w-full focus:border-red-500 outline-none">
                        <template x-for="n in getPlayerCountOptions()" :key="n">
                            <option :value="n" x-text="n + ' Player' + (n === 1 ? '' : 's')"></option>
                        </template>
                    </select>
                </div>
            </template>

            <!-- Player Name Configuration Grid:
                 Uses :key="gameMode + '-' + index" so when Game Mode changes, inputs re-mount
                 cleanly with the default names (P1, P2, etc.) -->
            <div :class="getPlayerNameSetupGridClasses()" class="grid gap-3 mb-4">
                <template x-for="(slot, index) in getPlayerSlots()" :key="gameMode + '-' + index">
                    <div>
                        <label class="text-[16.8px] text-slate-400 mb-1 block" x-text="'Player ' + (index + 1) + ' Name'">Player Name</label>
                        <input
                            type="text"
                            :maxlength="getPlayerNameMaxLength()"
                            :value="players[index]?.name || ''"
                            @input="setPlayerName(index, $event.target.value, $event)"
                            class="bg-slate-800 border border-slate-700 rounded p-3 text-[25.2px] text-white font-bold w-full uppercase focus:border-red-500 outline-none"
                        >
                    </div>
                </template>
            </div>

            <!-- Start Match Action: Initializes players and switches view to live scoring -->
            <button @click="startMatch()" class="w-full bg-red-600 hover:bg-red-500 font-black py-4 rounded-xl text-[28px] shadow-lg tracking-wide transition-colors">START MATCH</button>
        </div>

        <!-- ====================================================================
             2. LIVE SCORING INTERFACE (screen === 'scoring')
             Houses the scoreboard, active game matrix/guide, and game-specific keypad.
             ==================================================================== -->
        <div x-show="screen === 'scoring'" class="flex-1 flex flex-col h-full overflow-hidden">
            
            <!-- SCOREBOARD HEADER (Used for X01 and Cricket games; BowTie and Shanghai use custom layouts; scaled 20%) -->
            <template x-if="!isBowTieGameMode() && !isShanghaiGameMode()">
                <div :class="(isX01GameMode() ? 'grid-cols-' + players.length : 'grid ' + getPlayerGridClasses()) + ' bg-slate-800 border-b border-slate-700 text-center shrink-0 grid'" class="grid grid-cols-2">
                    <template x-for="(player, index) in players" :key="index">
                        <div
                            :class="(activePlayer === index ? 'bg-slate-700/80 border-b-4 border-red-500' : 'opacity-70') + (isX01GameMode() ? ' p-2' : (isCricketGameMode() ? ' p-3' : ' p-3.5'))"
                            class="transition-all border-r border-slate-700 last:border-r-0"
                        >
                            <!-- Player Name (scaled 20%) -->
                            <div class="text-sm font-bold uppercase tracking-wider text-slate-300 truncate" x-text="player.name"></div>
                            <!-- Current Score: Remaining points for X01, Cricket points for Cricket (scaled 20%) -->
                            <div :class="(activePlayer === index ? 'font-black' : 'font-normal') + (isX01GameMode() ? ' text-[2.2rem] my-0.5' : (isCricketGameMode() ? ' text-[3.5rem] my-0.5' : ' text-[44px] my-1')) + (flashingPlayerIndex === index ? ' text-yellow-400 score-flash' : ' text-white')" x-text="isX01GameMode() ? player.score : player.cricketScore"></div>
                            <!-- 3-Dart Running Average & Last Turn Score (X01 games only; scaled 20%) -->
                            <template x-if="isX01GameMode()">
                                <div class="text-xs text-slate-300">Avg: <span class="font-bold" x-text="getPlayerAvg(index)"></span> <span class="mx-1 text-slate-500">|</span> Last: <span class="font-bold text-slate-100" x-text="getPlayerLastTurnScore(index)"></span></div>
                            </template>
                        </div>
                    </template>
                </div>
            </template>

            <!-- DYNAMIC GAME BOARD / STATS DISPLAY AREA -->
            <div class="game-board-area flex-1 p-1 sm:p-2 flex flex-col justify-start items-center overflow-y-auto min-h-0">
                
                <!-- X01 CHECKOUT GUIDE (scaled 20%)
                     Suggests optimal 2-dart and 3-dart double-finish routes for remaining score <= 170 -->
                <template x-if="isX01GameMode()">
                    <div class="text-center mb-1">
                        <div class="text-sm text-yellow-400 font-bold uppercase tracking-widest mb-0" x-show="checkoutInfo().oneDart || checkoutInfo().twoDart">Checkout Suggestion</div>
                        <div class="mt-0.5 text-base text-slate-200" x-show="checkoutInfo().oneDart || checkoutInfo().twoDart || checkoutInfo().threeDart" x-text="`${checkoutInfo().oneDart ? '1 Dart: ' + checkoutInfo().oneDart : ''}${checkoutInfo().oneDart && (checkoutInfo().twoDart || checkoutInfo().threeDart) ? '   ---   ' : ''}${checkoutInfo().twoDart ? '2 Dart: ' + checkoutInfo().twoDart : ''}${checkoutInfo().twoDart && checkoutInfo().threeDart ? '   ---   ' : ''}${checkoutInfo().threeDart ? '3 Dart: ' + checkoutInfo().threeDart : ''}`"></div>
                    </div>
                </template>

                <!-- CRICKET MATRIX BOARD (scaled 20%)
                     Displays marks for targets: 20, 19, 18, 17, 16, 15, and Bullseye (B).
                     Includes Triple (T), Single (number), and Double (D) hit buttons. -->
                <template x-if="isCricketGameMode()">
                    <div class="w-full max-w-[580px] bg-slate-800 rounded-xl overflow-hidden border border-slate-700 text-lg mb-0 shadow">
                        <!-- Column Headers: Player Names & Target Label (scaled 20%) -->
                        <div class="grid text-center font-bold text-[32px] uppercase tracking-wide bg-slate-700 p-3" :style="'grid-template-columns: repeat(' + players.length + ', minmax(0, 1fr)) 236px'">
                            <template x-for="(player, index) in players" :key="index">
                                <div class="px-1 flex items-center justify-center"><span x-text="player.name"></span></div>
                            </template>
                            <div class="text-center text-[38px] leading-none flex items-center justify-center">Target</div>
                        </div>

                        <!-- Target Rows: Mark indicators and interactive hit buttons (scaled 20%) -->
                        <template x-for="target in [20, 19, 18, 17, 16, 15, 'B']">
                            <div class="grid px-2.5 py-0.5 text-center border-t border-slate-700 items-center font-mono font-bold gap-1" :style="'grid-template-columns: repeat(' + players.length + ', minmax(0, 1fr)) 236px'">
                                <!-- Player Marks Column: Displays -, /, X, or ⨷ (closed; yellow only for current-turn hits, white for prior turns) -->
                                <template x-for="(player, index) in players" :key="index">
                                    <div class="min-h-[58px] flex items-center justify-center text-[53px] leading-none" :class="player.marks[target] > 0 ? (index === activePlayer && cricketTurnMarks[target] ? 'text-yellow-400' : 'text-white') : 'text-slate-400'">
                                        <span x-text="renderMarks(player.marks[target])"></span>
                                    </div>
                                </template>
                                <!-- Hit Controls Column: T (Triple), Target (Single), D (Double; scaled 20%) -->
                                <div class="grid grid-cols-[58px_67px_58px] items-center justify-items-center justify-center gap-3 sm:gap-4 text-slate-200 bg-slate-900 py-1 px-1.5 rounded w-full ml-auto text-center">
                                    <!-- Triple button (not available for Bullseye) -->
                                    <template x-if="target !== 'B'">
                                        <button @click="hitCricket(activePlayer, target, 3)" :disabled="isGameOver" class="w-[58px] h-[58px] bg-red-600 hover:bg-red-500 rounded text-[60px] leading-none text-white flex items-center justify-center disabled:opacity-40">T</button>
                                    </template>
                                    <template x-if="target === 'B'">
                                        <div class="w-[58px] h-[58px]"></div>
                                    </template>
                                    <!-- Single hit button (displays target number or 'B') -->
                                    <button @click="hitCricket(activePlayer, target, 1)" :disabled="isGameOver" class="w-[67px] h-[58px] bg-red-600 hover:bg-red-500 rounded text-[60px] leading-none text-white flex items-center justify-center disabled:opacity-40" x-text="target"></button>
                                    <!-- Double hit button -->
                                    <button @click="hitCricket(activePlayer, target, 2)" :disabled="isGameOver" class="w-[58px] h-[58px] bg-red-600 hover:bg-red-500 rounded text-[60px] leading-none text-white flex items-center justify-center disabled:opacity-40">D</button>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- CRICKET KEYPAD / ACTION CONTROLS (scaled 20%)
                     Contains Score for round box, UNDO and ENTER buttons, plus the reserved message banner.
                     Maintains min-h-[1.5rem] and \u00A0 by default so buttons stay large. -->
                <template x-if="isCricketGameMode()">
                    <div class="w-full max-w-[580px] mt-1 mb-1">
                        <!-- Cricket Round Input Display -->
                        <div class="mb-1.5">
                            <input
                                type="text"
                                readonly
                                :value="cricketRoundInput"
                                placeholder="T20 D19 18"
                                class="w-full rounded-md border border-slate-600 bg-slate-950 px-2.5 py-2 text-base font-mono text-white placeholder:text-slate-500 outline-none"
                            />
                        </div>
                        <!-- Alert / Notification banner (e.g. closed target alert, 3-dart hit limit) -->
                        <div
                            class="w-full text-center text-red-500 font-bold text-sm mb-1 min-h-[1.5rem] flex items-center justify-center"
                            x-text="winMessage || cricketHitLimitMessage || '\u00A0'"
                        ></div>
                        <!-- Undo and Enter actions (scaled 20%) -->
                        <div class="grid grid-cols-2 gap-2.5">
                            <button @click="undo()" class="bg-yellow-600 hover:bg-yellow-500 font-bold py-3 rounded-xl text-lg transition-colors shadow">UNDO</button>
                            <button @click="submitCricketTurn()" :disabled="winMessage !== ''" class="bg-green-600 hover:bg-green-500 font-bold py-3 rounded-xl text-lg transition-colors shadow">ENTER</button>
                        </div>
                    </div>
                </template>

                <!-- BOWTIE GAME BOARD & KEYPAD (scaled 20%)
                     BowTie consists of 12 rounds: Free, 20, 19, Treble, 18, 17, Double, 16, 15, 3 Color, BT, Bull.
                     Scores halve if a player fails to score in a round. -->
                <template x-if="isBowTieGameMode()">
                    <div class="w-full max-w-[614px] bg-slate-800 rounded-xl border border-slate-700 p-2.5 sm:p-3.5 text-base mb-2 mx-auto shadow">
                        <!-- Active Player and Current Target Round indicator (scaled 20%) -->
                        <div class="mt-1 text-lg leading-6 text-slate-300 flex items-center gap-3.5 whitespace-nowrap">
                            <span>Active player: <span class="text-red-500 font-black" x-text="players[activePlayer].name"></span></span>
                            <span>Target Round: <span class="text-red-500 font-black" x-text="getCurrentBowTieRound().label"></span></span>
                        </div>

                        <div class="mt-2.5 grid grid-cols-[140px_minmax(0,1fr)] sm:grid-cols-[154px_minmax(0,1fr)] gap-2.5 items-start">
                            <!-- Left Column: 12 BowTie Targets list with active round highlight (scaled 20%) -->
                            <div class="space-y-1.5 rounded-lg border border-slate-700 bg-slate-900/50 p-2">
                                <div class="px-1 text-[11px] uppercase tracking-[0.18em] text-slate-400">TARGETS</div>
                                <template x-for="(target, index) in [
                                    'Free', 20, 19, 'Treble (T)', 18, 17, 'Double (D)',
                                    16, 15, '3 Color', 'BowTie (BT)', 'Bull (B)'
                                ]" :key="index">
                                    <button
                                        type="button"
                                        :disabled="['Free', 'Treble (T)', 'Double (D)', '3 Color', 'BowTie (BT)'].includes(target)"
                                        @click="if (!['Free', 'Treble (T)', 'Double (D)', '3 Color', 'BowTie (BT)'].includes(target)) addBowTieRoundTarget(target)"
                                        :class="[
                                            'w-full whitespace-nowrap rounded-md border border-slate-600 px-1.5 py-2 text-[15.6px] sm:text-[16.9px] font-black text-slate-100 hover:brightness-110 focus:outline-none active:scale-[0.98] bg-slate-700/90',
                                            isCurrentBowTieTarget(target) ? 'bg-red-300 text-red-950 border-red-200 shadow-[0_0_0_2px_rgba(254,202,202,0.9),0_0_16px_rgba(239,68,68,0.7)] ring-2 ring-red-200/90' : '',
                                            ['Free', 'Treble (T)', 'Double (D)', '3 Color', 'BowTie (BT)'].includes(target) ? 'opacity-50 cursor-not-allowed' : ''
                                        ]"
                                        x-text="target"
                                    ></button>
                                </template>
                            </div>

                            <!-- Right Column: Player scores grid, BowTie keypad, and turn input -->
                            <div class="flex flex-col">
                                <!-- Multi-player Scorecards Grid (scaled 20%) -->
                                <div class="grid gap-2">
                                    <template x-for="(row, rowIndex) in getBowTiePlayerRows()" :key="rowIndex">
                                        <div class="grid gap-2" :style="'grid-template-columns: repeat(' + row.length + ', minmax(0, 1fr))'">
                                            <template x-for="(player, index) in row" :key="player.index">
                                                <div :class="activePlayer === player.index ? 'bg-slate-700 border-t-4 border-red-500' : 'bg-slate-900/70'" class="min-w-0 rounded-lg border border-slate-700 px-1 py-2 text-center">
                                                    <div class="text-[11px] font-bold uppercase tracking-wide text-slate-400 truncate" x-text="player.name"></div>
                                                    <div
                                                        class="mt-1 font-black tracking-tight leading-none whitespace-nowrap"
                                                        :class="(activePlayer === player.index ? 'font-black ' : 'font-normal ') + (String(player.bowTieScore).length >= 4 ? 'text-xl' : (String(player.bowTieScore).length === 3 ? 'text-2xl' : 'text-3xl')) + (flashingPlayerIndex === player.index ? ' text-yellow-400 score-flash' : ' text-white')"
                                                        x-text="player.bowTieScore"
                                                    ></div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>

                                <!-- BowTie Numeric Keypad (4 columns x 4 rows; scaled 20%):
                                     Col 1-3: Numbers 0-9 and operators (+, *)
                                     Col 4: Row 1 = Del, Row 2 = CLEAR, Row 3 = UNDO, Row 4 = Spacer -->
                                <div class="grid grid-cols-4 gap-2 my-2">
                                    <button @click="pressKey('1')" :disabled="isGameOver" class="keypad-btn bg-slate-700 hover:bg-slate-600 text-[20.8px] font-bold py-2 rounded-lg disabled:opacity-40">1</button>
                                    <button @click="pressKey('2')" :disabled="isGameOver" class="keypad-btn bg-slate-700 hover:bg-slate-600 text-[20.8px] font-bold py-2 rounded-lg disabled:opacity-40">2</button>
                                    <button @click="pressKey('3')" :disabled="isGameOver" class="keypad-btn bg-slate-700 hover:bg-slate-600 text-[20.8px] font-bold py-2 rounded-lg disabled:opacity-40">3</button>

    <!-- ========================================================================
         APPLICATION SCRIPT LOGIC (Alpine.js dartApp)
         Implements game state management, turn calculations, rules enforcement,
         checkouts, and undo history across all supported dart games.
         ======================================================================== -->
    <script>
        function dartApp() {
            return {
                /* ------------------------------------------------------------------
                   APPLICATION STATE PROPERTIES
                   ------------------------------------------------------------------ */
                screen: 'menu',                    // Current screen: 'menu' (setup) or 'scoring' (live match)\n        isGameOver: false,           // Track if a leg/game has been won
                gameMode: '501',                   // Selected game mode ('501', '301', 'Cricket', 'BowTie', 'Shanghai', etc.)
                startingMode: 'Straight-in',       // X01 starting rule ('Straight-in' or 'Double-in')
                matchType: 'Single Leg',           // Match structure type
                playerCount: 2,                    // Number of active players
                activePlayer: 0,                   // Index of the player whose turn it currently is
                currentTurnScore: '',              // Active turn score expression for X01 (e.g. '20*3 + 19')
                bowTieRoundIndex: 0,               // Current active round index in BowTie (0 to 11)
                bowTieDarts: [],                   // Recorded darts thrown in the current BowTie round
                bowTieRoundInput: '',              // Text expression for BowTie round score
                bowTieMessage: '',                 // Validation / alert message for BowTie (e.g. max score 180)
                cricketRoundInput: '',             // Recorded button clicks for current Cricket turn (e.g. 'T20 D19 18')
                cricketTurnMarks: {},              // Targets hit by the active player during the current Cricket turn
                cricketHitLimitMessage: '',        // Alert message for Cricket (closed target or 3-dart limit)
                x01BustMessage: '',                // Alert message for X01 (Bust or max score 180)
                flashingPlayerIndex: null,         // Index of player whose score is currently flashing
                flashTimeoutId: null,              // Timeout handle for clearing score flash animation
                // Shanghai state
                shanghaiRoundIndex: 0,             // Current round index (0-9, representing targets 1-10)
                shanghaiMessage: '',               // Alert/status message for Shanghai game
                winMessage: '',                    // Game-win message shown in the message space instead of a pop-up
                players: [                         // List of player state objects
                    { name: 'P1', score: 501, history: [], cricketScore: 0, marks: {20:0, 19:0, 18:0, 17:0, 16:0, 15:0, 'B':0}, turnDarts: 0, bowTieScore: 0 },
                    { name: 'P2', score: 501, history: [], cricketScore: 0, marks: {20:0, 19:0, 18:0, 17:0, 16:0, 15:0, 'B':0}, turnDarts: 0, bowTieScore: 0 }
                ],
                lastTurn: null,                    // Details of the most recent completed turn
                undoStack: [],                     // Stack of game state snapshots for multi-level undo
                fullscreenOptOut: false,           // Prevents auto-re-entering fullscreen after user clicks Exit
                fullscreenListenersAttached: false,
                showFullscreenPopup: false,        // Shows full-screen prompt pop-up on mobile/iPad when browser chrome is visible
                fullscreenBlockedFallback: false,  // True if requestFullscreen was rejected and Home Screen instructions should be shown

                /* ------------------------------------------------------------------
                   FULLSCREEN & PAGE NAVIGATION METHODS
                   ------------------------------------------------------------------ */
                initApp() {
                    this.setupPlayerNames();
                    this.initFullscreenSupport();
                },

                /**
                 * Returns true when running on a mobile device or iPad (including iPadOS).
                 */
                isMobileOrIpad() {
                    const ua = navigator.userAgent || '';
                    const isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
                    const isIpadOS = (navigator.platform === 'MacIntel' || /Macintosh/i.test(ua)) && navigator.maxTouchPoints > 1;
                    return isMobileUA || isIpadOS;
                },

                /**
                 * Returns true when running as an installed/Home Screen standalone or fullscreen web app.
                 */
                isStandaloneMode() {
                    return Boolean(
                        window.navigator.standalone === true ||
                        (window.matchMedia && (
                            window.matchMedia('(display-mode: fullscreen)').matches ||
                            window.matchMedia('(display-mode: standalone)').matches
                        ))
                    );
                },

                /**
                 * Returns true if the browser exposes the Fullscreen API on the root element.
                 */
                canUseFullscreenApi() {
                    const el = document.documentElement;
                    return Boolean(
                        el.requestFullscreen ||
                        el.webkitRequestFullscreen ||
                        el.mozRequestFullScreen ||
                        el.msRequestFullscreen
                    );
                },

                /**
                 * Returns true if the document is currently in fullscreen mode.
                 */
                isFullscreenActive() {
                    return Boolean(
                        document.fullscreenElement ||
                        document.webkitFullscreenElement ||
                        document.mozFullScreenElement ||
                        document.msFullscreenElement
                    );
                },

                /**
                 * Requests fullscreen mode on the root document element, hiding browser navigation UI.
                 */
                enterFullscreenMode() {
                    if (this.isFullscreenActive() || this.isStandaloneMode()) {
                        this.showFullscreenPopup = false;
                        return Promise.resolve(true);
                    }
                    const el = document.documentElement;
                    try {
                        if (el.requestFullscreen) {
                            let res;
                            try {
                                res = el.requestFullscreen({ navigationUI: 'hide' });
                            } catch (optErr) {
                                res = el.requestFullscreen();
                            }
                            return Promise.resolve(res).then(() => {
                                this.showFullscreenPopup = false;
                                return true;
                            }).catch(() => false);
                        }
                        const req = el.webkitRequestFullscreen
                            || el.mozRequestFullScreen
                            || el.msRequestFullscreen;
                        if (req) {
                            const res = req.call(el);
                            return Promise.resolve(res).then(() => {
                                this.showFullscreenPopup = false;
                                return true;
                            }).catch(() => false);
                        }
                    } catch (e) {}
                    return Promise.resolve(false);
                },

                /**
                 * Triggered by the "Enter Full Screen" button in the pop-up.
                 */
                confirmEnterFullscreen() {
                    this.fullscreenOptOut = false;
                    this.enterFullscreenMode().then((entered) => {
                        if (entered || this.isFullscreenActive()) {
                            this.showFullscreenPopup = false;
                        } else {
                            this.fullscreenBlockedFallback = true;
                        }
                    });
                },

                /**
                 * Dismisses the full-screen pop-up without forcing fullscreen.
                 */
                dismissFullscreenPopup() {
                    this.showFullscreenPopup = false;
                    this.fullscreenOptOut = true;
                },

                /**
                 * Exits fullscreen mode and prevents automatic re-entry until reload.
                 */
                exitFullscreenMode() {
                    this.fullscreenOptOut = true;
                    this.showFullscreenPopup = false;
                    const exitFn = document.exitFullscreen
                        || document.webkitExitFullscreen
                        || document.webkitCancelFullScreen
                        || document.mozCancelFullScreen
                        || document.msExitFullscreen;
                    if (exitFn && this.isFullscreenActive()) {
                        try {
                            const result = exitFn.call(document);
                            if (result && typeof result.catch === 'function') {
                                result.catch(() => {});
                            }
                        } catch (e) {}
                    }
                },

                /**
                 * Reloads index.html from the web, bypassing cached responses where supported.
                 */
                reloadPage() {
                    const targetUrl = new URL('index.html', window.location.href).href;
                    fetch(targetUrl, { cache: 'reload' })
                        .catch(() => {})
                        .finally(() => {
                            if (window.location.pathname.endsWith('/index.html')) {
                                window.location.reload();
                            } else {
                                window.location.href = targetUrl;
                            }
                        });
                },

                /**
                 * Enables automatic fullscreen mode and pop-up prompt on mobile and iPad across all screens and games.
                 */
                initFullscreenSupport() {
                    if (!this.isMobileOrIpad() || this.fullscreenListenersAttached) return;
                    this.fullscreenListenersAttached = true;

                    const syncPopupVisibility = () => {
                        if (this.isFullscreenActive() || this.isStandaloneMode()) {
                            this.showFullscreenPopup = false;
                        } else if (!this.fullscreenOptOut) {
                            this.showFullscreenPopup = true;
                        }
                    };

                    document.addEventListener('fullscreenchange', syncPopupVisibility);
                    document.addEventListener('webkitfullscreenchange', syncPopupVisibility);

                    // Attempt immediate fullscreen if permitted by the browser/webview; otherwise show the pop-up
                    this.enterFullscreenMode().then((entered) => {
                        if (!entered && !this.isFullscreenActive() && !this.isStandaloneMode() && !this.fullscreenOptOut) {
                            this.showFullscreenPopup = true;
                        }
                    });

                    // Browsers require a trusted user gesture (click/touchend) for Fullscreen API
                    const ensureFullscreenOnGesture = (event) => {
                        if (this.fullscreenOptOut || this.isFullscreenActive() || this.isStandaloneMode()) return;
                        if (event.target && event.target.closest && event.target.closest('[data-exit-fullscreen]')) return;
                        this.enterFullscreenMode();
                    };
                    document.addEventListener('touchend', ensureFullscreenOnGesture, { capture: true, passive: true });
                    document.addEventListener('click', ensureFullscreenOnGesture, { capture: true, passive: true });
                },

                /* ------------------------------------------------------------------
                   UNDO & STATE PERSISTENCE METHODS
                   ------------------------------------------------------------------ */
                /**
                 * Captures a snapshot of the current game state and pushes it onto the undo stack.
                 */
                saveUndoState() {
                    this.undoStack.push({
                        screen: this.screen,
                        gameMode: this.gameMode,
                        startingMode: this.startingMode,
                        playerCount: this.playerCount,
                        activePlayer: this.activePlayer,
                        currentTurnScore: this.currentTurnScore,
                        bowTieRoundIndex: this.bowTieRoundIndex,
                        bowTieDarts: JSON.parse(JSON.stringify(this.bowTieDarts || [])),
                        bowTieRoundInput: this.bowTieRoundInput,
                        bowTieMessage: this.bowTieMessage,
                        cricketRoundInput: this.cricketRoundInput,
                        cricketTurnMarks: { ...(this.cricketTurnMarks || {}) },
                        cricketHitLimitMessage: this.cricketHitLimitMessage,
                        players: JSON.parse(JSON.stringify(this.players)),
                        lastTurn: this.lastTurn ? { ...this.lastTurn } : null,
                        shanghaiRoundIndex: this.shanghaiRoundIndex,
                        isGameOver: this.isGameOver,
                        winMessage: this.winMessage
                    });
                },

                /**
                 * Restores the game state from a previously captured undo snapshot.
                 */
                restoreUndoState(snapshot) {
                    if (!snapshot) return;
                    this.screen = snapshot.screen;
                    this.gameMode = snapshot.gameMode;
                    this.startingMode = snapshot.startingMode || 'Straight-in';
                    this.playerCount = snapshot.playerCount;
                    this.activePlayer = snapshot.activePlayer;
                    this.currentTurnScore = snapshot.currentTurnScore;
                    this.bowTieRoundIndex = snapshot.bowTieRoundIndex ?? 0;
                    this.bowTieDarts = JSON.parse(JSON.stringify(snapshot.bowTieDarts || []));
                    this.bowTieRoundInput = snapshot.bowTieRoundInput || '';
                    this.bowTieMessage = snapshot.bowTieMessage || '';
                    this.cricketRoundInput = snapshot.cricketRoundInput || '';
                    this.cricketTurnMarks = { ...(snapshot.cricketTurnMarks || {}) };
                    this.cricketHitLimitMessage = snapshot.cricketHitLimitMessage || '';
                    this.players = JSON.parse(JSON.stringify(snapshot.players));
                    this.lastTurn = snapshot.lastTurn ? { ...snapshot.lastTurn } : null;
                    this.shanghaiRoundIndex = snapshot.shanghaiRoundIndex ?? 0;
                    this.isGameOver = snapshot.isGameOver ?? false;
                    this.winMessage = snapshot.winMessage || '';
                },

                /**
                 * Creates an initial baseline snapshot for undo operations when a match starts.
                 */
                saveUndoStateSnapshot() {
                    return {
                        screen: this.screen,
                        gameMode: this.gameMode,
                        startingMode: this.startingMode,
                        playerCount: this.playerCount,
                        activePlayer: this.activePlayer,
                        currentTurnScore: this.currentTurnScore,
                        bowTieRoundIndex: this.bowTieRoundIndex ?? 0,
                        bowTieDarts: JSON.parse(JSON.stringify(this.bowTieDarts || [])),
                        bowTieRoundInput: this.bowTieRoundInput || '',
                        bowTieMessage: this.bowTieMessage || '',
                        cricketRoundInput: this.cricketRoundInput || '',
                        cricketTurnMarks: { ...(this.cricketTurnMarks || {}) },
                        cricketHitLimitMessage: this.cricketHitLimitMessage || '',
                        players: JSON.parse(JSON.stringify(this.players)),
                        lastTurn: this.lastTurn ? { ...this.lastTurn } : null,
                        shanghaiRoundIndex: this.shanghaiRoundIndex ?? 0,
                        isGameOver: this.isGameOver,
                        winMessage: this.winMessage || ''
                    };
                },

                /**
                 * Reverts the most recent turn or dart hit and restores previous state.
                 */
                undo() {
                    if (this.undoStack.length <= 1) {
                        const base = this.undoStack[0] || this.saveUndoStateSnapshot();
                        this.restoreUndoState(base);
                        this.undoStack = [base];
                        return;
                    }

                    const previous = this.undoStack.pop();
                    this.restoreUndoState(previous);
                    // Clear any transient warning messages when undoing
                    this.cricketHitLimitMessage = '';
                    this.x01BustMessage = '';
                    this.bowTieMessage = '';
                    this.shanghaiMessage = '';
                    this.winMessage = '';
                    this.isGameOver = false;  // Re-enable all buttons after undo
                    this.clearScoreFlash();
                },

                /**
                 * Highlights a player's score in yellow (with a brief flash) when it changes during their turn.
                 * Stays yellow until clearScoreFlash() is called when ENTER is selected.
                 */
                triggerScoreFlash(playerIndex) {
                    if (this.flashTimeoutId) {
                        clearTimeout(this.flashTimeoutId);
                        this.flashTimeoutId = null;
                    }
                    this.flashingPlayerIndex = null;
                    this.$nextTick(() => {
                        this.flashingPlayerIndex = playerIndex;
                    });
                },

                /**
                 * Immediately clears the score highlight so the player's score returns to white.
                 */
                clearScoreFlash() {
                    if (this.flashTimeoutId) {
                        clearTimeout(this.flashTimeoutId);
                        this.flashTimeoutId = null;
                    }
                    this.flashingPlayerIndex = null;
                },

                /* ------------------------------------------------------------------
                   GAME MODE PREDICATES & PLAYER CONFIGURATION
                   ------------------------------------------------------------------ */
                /** Check if current mode is either standard 2-player Cricket or 3-Way Cricket */
                isCricketGameMode() {
                    return this.isStandardCricketGameMode() || this.isThreeWayCricketGameMode();
                },

                /** Check if current mode is standard 2-player Cricket */
                isStandardCricketGameMode() {
                    return this.gameMode === 'Cricket';
                },

                /** Check if current mode is 3-Way Cricket */
                isThreeWayCricketGameMode() {
                    return this.gameMode === '3-Way Cricket';
                },

                /** Check if current mode is an X01 game (601, 501, 401, 301, 201, 101) */
                isX01GameMode() {
                    return ['601', '501', '401', '301', '201', '101'].includes(String(this.gameMode));
                },

                /** Check if current mode is BowTie */
                isBowTieGameMode() {
                    return this.gameMode === 'BowTie';
                },

                /** Check if current mode is Shanghai */
                isShanghaiGameMode() {
                    return this.gameMode === 'Shanghai';
                },

                /** Returns maximum allowed players for the current game mode */
                getMaxPlayerCount() {
                    if (this.isBowTieGameMode() || this.isShanghaiGameMode()) return 15;
                    if (this.isX01GameMode()) return 4;
                    if (this.isThreeWayCricketGameMode()) return 3;
                    return 6;  // Standard Cricket: up to 6 players
                },

                /** Returns an array [1, 2, ..., max] for the player count selector */
                getPlayerCountOptions() {
                    const max = this.getMaxPlayerCount();
                    return Array.from({ length: max }, (_, index) => index + 1);
                },

                /** Returns array of player slot descriptor objects for the setup screen */
                getPlayerSlots() {
                    const count = this.isThreeWayCricketGameMode()
                        ? 3
                        : Math.min(this.getMaxPlayerCount(), Math.max(1, Number(this.playerCount) || 2));
                    return Array.from({ length: count }, (_, index) => ({ 
                        index, 
                        name: this.players[index]?.name || `P${index + 1}` 
                    }));
                },

                /** CSS grid classes for player name inputs on setup screen */
                getPlayerNameSetupGridClasses() {
                    const count = this.getPlayerSlots().length;
                    if (count > 6) return 'grid-cols-4';
                    if (count === 3) return 'grid-cols-3';
                    if (count === 1) return 'grid-cols-1';
                    return 'grid-cols-2';
                },

                /** CSS grid classes for the live scoreboard header */
                getPlayerGridClasses() {
                    const count = this.players.length || this.playerCount || 2;
                    if (count <= 2) return 'grid-cols-2';
                    if (count === 3) return 'grid-cols-3';
                    if (count <= 4) return 'grid-cols-2';
                    if (count <= 6) return 'grid-cols-3';
                    return 'grid-cols-4';
                },

                /** Returns maximum allowed character length for player names */
                getPlayerNameMaxLength() {
                    if (this.isBowTieGameMode()) return 5;
                    return Number(this.playerCount) > 6 ? 2 : 5;
                },

                /**
                 * Sanitizes and updates a player's name during setup (uppercase, alphanumeric only).
                 */
                setPlayerName(index, value, event) {
                    const maxLength = this.getPlayerNameMaxLength();
                    const nextValue = String(value || '').replace(/[^A-Za-z0-9]/g, '').slice(0, maxLength).toUpperCase();
                    if (event && event.target) {
                        event.target.value = nextValue;
                    }
                    if (!this.players[index]) {
                        this.setupPlayerNames();
                    }
                    if (this.players[index]) {
                        this.players[index].name = nextValue;
                    }
                },

                /**
                 * Triggered when the user selects a new "Game Mode" on the setup screen.
                 * Sets the default number of players appropriate for the chosen mode,
                 * and resets Player Names back to their default values (P1, P2, etc.).
                 */
                handleGameModeChange() {
                    // Set default player count appropriate for selected mode
                    if (this.isThreeWayCricketGameMode()) {
                        this.playerCount = 3;
                    } else if (this.isStandardCricketGameMode()) {
                        this.playerCount = 2;
                    } else if (['201', '101'].includes(String(this.gameMode))) {
                        this.playerCount = 1;
                    } else if (this.isX01GameMode()) {
                        this.playerCount = 2;
                    } else if (this.isBowTieGameMode()) {
                        this.playerCount = 2;
                    } else if (this.isShanghaiGameMode()) {
                        this.playerCount = 2;
                    }
                    // Reset player names back to defaults (P1, P2, P3, etc.)
                    this.setupPlayerNames(true);
                },

                /** Returns starting score for X01 modes (e.g. 501 for '501', 0 for others) */
                getStartingScore() {
                    return this.isX01GameMode() ? Number(this.gameMode) : 0;
                },

                /**
                 * Initializes or updates player objects according to the current mode and count.
                 * @param {boolean} resetToDefault - When true, resets names to default (P1, P2, ...)
                 */
                setupPlayerNames(resetToDefault = false) {
                    this.cricketHitLimitMessage = '';
                    const count = this.isThreeWayCricketGameMode()
                        ? 3
                        : Math.min(this.getMaxPlayerCount(), Math.max(1, Number(this.playerCount) || 2));
                    const existingPlayers = Array.isArray(this.players) ? this.players : [];
                    this.players = Array.from({ length: count }, (_, index) => {
                        const existing = existingPlayers[index];
                        const defaultName = `P${index + 1}`;
                        // If resetToDefault is true, always reset to P1, P2, etc.
                        const name = (!resetToDefault && existing && existing.name && existing.name.trim())
                            ? existing.name.trim().slice(0, this.getPlayerNameMaxLength()).toUpperCase()
                            : defaultName;
                        return {
                            name: name,
                            score: this.isX01GameMode() ? Number(this.gameMode) : 0,
                            history: existing && !resetToDefault ? existing.history || [] : [],
                            cricketScore: existing && !resetToDefault ? existing.cricketScore || 0 : 0,
                            marks: existing && !resetToDefault && existing.marks ? { ...existing.marks } : {20:0, 19:0, 18:0, 17:0, 16:0, 15:0, 'B':0},
                            turnDarts: existing && !resetToDefault ? existing.turnDarts || 0 : 0,
                            bowTieScore: existing && !resetToDefault ? existing.bowTieScore || 0 : 0,
                            shanghaiScore: existing && !resetToDefault ? existing.shanghaiScore || 0 : 0,
                            shanghaiTurnDarts: 0,
                            shanghaiTurnHits: [],
                            shanghaiEliminated: false
                        };
                    });
                },

                /**
                 * Begins a new match with the configured players and initial scores.
                 */
                startMatch() {
                    const startingScore = this.getStartingScore();
                    this.setupPlayerNames(false);
                    this.players = this.players.map((player, index) => ({
                        ...player,
                        name: (player.name && player.name.trim()) ? player.name.trim().slice(0, this.getPlayerNameMaxLength()).toUpperCase() : `P${index + 1}`,
                        score: startingScore,
                        history: [],
                        cricketScore: 0,
                        marks: {20:0, 19:0, 18:0, 17:0, 16:0, 15:0, 'B':0},
                        turnDarts: 0,
                        bowTieScore: 0,
                        shanghaiScore: 0,
                        shanghaiTurnDarts: 0,
                        shanghaiTurnHits: [],
                        shanghaiEliminated: false
                    }));
                    this.activePlayer = 0;
                    this.currentTurnScore = '';
                    this.bowTieRoundIndex = 0;
                    this.bowTieDarts = [];
                    this.bowTieRoundInput = '';
                    this.bowTieMessage = '';
                    this.cricketRoundInput = '';
                    this.cricketTurnMarks = {};
                    this.cricketHitLimitMessage = '';
                    this.x01BustMessage = '';
                    this.shanghaiRoundIndex = 0;
                    this.shanghaiMessage = '';
                    this.clearScoreFlash();
                    this.screen = 'scoring';
                    this.undoStack = [this.saveUndoStateSnapshot()];
                    if (this.isMobileOrIpad() && !this.fullscreenOptOut) {
                        this.enterFullscreenMode();
                    }
                },

                /**
                 * Returns back to the menu screen to configure a new match.
                 */
                resetMatch() {
                    if (this.isMobileOrIpad() && !this.fullscreenOptOut) {
                        this.enterFullscreenMode();
                    }
                    this.screen = 'menu';
                    this.isGameOver = false;  // Reset game over state
                    this.x01BustMessage = '';
                    this.bowTieMessage = '';
                    this.cricketRoundInput = '';
                    this.cricketTurnMarks = {};
                    this.cricketHitLimitMessage = '';
                    this.winMessage = '';
                    this.clearScoreFlash();
                },

                /* ------------------------------------------------------------------
                   BOWTIE GAME RULES & SCORING ENGINE
                   ------------------------------------------------------------------ */
                /* ------------------------------------------------------------------
                   SHANGHAI GAME RULES & SCORING ENGINE
                   ------------------------------------------------------------------ */

                /**
                 * Records a dart hit in Shanghai.
                 * @param {string} type - 'single', 'double', 'triple', or 'miss'
                 * Hit types:
                 *   single  → face value of round target
                 *   double  → 2× target
                 *   triple  → 3× target
                 *   miss    → 0 points
                 * Instant win ("Shanghai"): If a player hits Single + Double + Triple in one 3-dart turn
                 *   they immediately win, regardless of score position.
                 * Penalties on submitting a turn where ALL darts were misses (zero score):
                 *   Round 3 miss → score reset to 0
                 *   Round 5 miss → score halved (rounded up if odd)
                 *   Round 8 miss → player eliminated (skipped for rounds 9-10)
                 */
                hitShanghai(type) {
                    if (this.winMessage !== '') return;
                    const p = this.players[this.activePlayer];
                    if (!p) return;
                    if (p.shanghaiEliminated) {
                        this.shanghaiMessage = `${p.name} is eliminated — press ENTER to continue`;
                        return;
                    }
                    const darts = p.shanghaiTurnDarts || 0;
                    if (darts >= 3) {
                        this.shanghaiMessage = '3 darts thrown — press ENTER to submit or UNDO to correct';
                        return;
                    }
                    this.saveUndoState();
                    const target = this.shanghaiRoundIndex + 1;
                    let points = 0;
                    if (type === 'single') points = target;
                    else if (type === 'double') points = target * 2;
                    else if (type === 'triple') points = target * 3;
                    // miss → 0 points, dart still counted

                    p.shanghaiScore = (p.shanghaiScore || 0) + points;
                    if (points > 0) {
                        this.triggerScoreFlash(this.activePlayer);
                    }
                    p.shanghaiTurnDarts = darts + 1;
                    if (!p.shanghaiTurnHits) p.shanghaiTurnHits = [];
                    p.shanghaiTurnHits.push(type);

                    // Check for Shanghai instant win: Single + Double + Triple all hit in one turn (any order).
                    // Each scoring button may be hit more than once per turn (e.g. three Triples).
                    const hits = p.shanghaiTurnHits;
                    if (hits.includes('single') && hits.includes('double') && hits.includes('triple')) {
                        this.shanghaiMessage = '';
                        this.winMessage = `🎯 SHANGHAI! ${p.name} wins with a Single, Double & Triple on ${target}! Click New Match to start a new game.`;
                    }
                },

                /**
                 * Submits the active player's Shanghai turn.
                 * Applies penalties for missing the target on rounds 3, 5, 8.
                 * Advances to the next non-eliminated player and next round when all players have thrown.
                 */
                submitShanghaiTurn() {
                    if (!this.isShanghaiGameMode()) return;
                    const p = this.players[this.activePlayer];
                    if (!p) return;

                    // If player is eliminated, just skip their turn
                    if (p.shanghaiEliminated) {
                        this.advanceShanghaiTurn(false);
                        return;
                    }

                    this.saveUndoState();
                    const target = this.shanghaiRoundIndex + 1;

                    // Calculate turn score from recorded hits (a hit type may be recorded more than once per turn)
                    let turnScore = 0;
                    const hits = p.shanghaiTurnHits || [];
                    for (const t of hits) {
                        if (t === 'single') turnScore += target;
                        else if (t === 'double') turnScore += target * 2;
                        else if (t === 'triple') turnScore += target * 3;
                    }

                    // Apply penalty rules when player scored 0 on the target this turn
                    if (turnScore === 0) {
                        if (target === 3) {
                            // Miss target 3: score reset to zero
                            p.shanghaiScore = 0;
                            this.clearScoreFlash();
                            this.shanghaiMessage = `${p.name} missed target 3 — score reset to 0!`;
                        } else if (target === 5) {
                            // Miss target 5: score halved (round up if odd before halving)
                            const before = p.shanghaiScore || 0;
                            const adjusted = before % 2 === 1 ? before + 1 : before;
                            p.shanghaiScore = Math.floor(adjusted / 2);
                            this.clearScoreFlash();
                            this.shanghaiMessage = `${p.name} missed target 5 — score halved to ${p.shanghaiScore}!`;
                        } else if (target === 8) {
                            // Miss target 8: player is eliminated from remaining rounds
                            p.shanghaiEliminated = true;
                            this.clearScoreFlash();
                            this.shanghaiMessage = `${p.name} missed target 8 — ELIMINATED!`;
                            // In a 2-player game, if one player misses target 8, the other player wins
                            if (this.players.length === 2) {
                                const otherIdx = this.activePlayer === 0 ? 1 : 0;
                                const other = this.players[otherIdx];
                                if (!other.shanghaiEliminated) {
                                    this.winMessage = `${other.name} WINS! Opponent missed target 8. Click New Match to start a new game.`;
                                    this.isGameOver = true;
                                    this.saveUndoStateSnapshot();
                                    return;
                                }
                            }
                        } else {
                            this.clearScoreFlash();
                        }
                    } else {
                        this.clearScoreFlash();
                        this.shanghaiMessage = '';
                    }

                    // Reset per-turn tracking flags
                    p.shanghaiTurnDarts = 0;
                    p.shanghaiTurnHits = [];

                    this.advanceShanghaiTurn(true);
                },

                /**
                 * Advances to the next player (skipping eliminated players).
                 * When all players have completed the current round, increments to the next round.
                 * When all 10 rounds are complete, declares the winner and restarts on the scoring screen.
                 * @param {boolean} preserveMessage - When true, keeps the current penalty message visible briefly
                 */
                advanceShanghaiTurn(preserveMessage) {
                    const totalPlayers = this.players.length;
                    const nextPlayer = (this.activePlayer + 1) % totalPlayers;

                    // If we wrapped back around to player 0, a full round cycle was completed
                    if (nextPlayer === 0 || nextPlayer <= this.activePlayer) {
                        this.shanghaiRoundIndex += 1;
                        // Remove any message shown for the round that just ended so the
                        // target warning (rounds 3, 5, 8) is cleared once the round target
                        // moves to the next number.
                        this.shanghaiMessage = '';
                        // Show target-specific warning messages in the row above ENTER
                        const newTarget = this.shanghaiRoundIndex + 1;
                        if (newTarget === 3) {
                            this.shanghaiMessage = 'If you miss a 3, your score goes to zero!';
                        } else if (newTarget === 5) {
                            this.shanghaiMessage = 'If you miss a 5, your score will be cut in half!';
                        } else if (newTarget === 8) {
                            this.shanghaiMessage = 'If you miss an 8, you will be out of the game!';
                        }

                        // Check game over (all 10 rounds done)
                        if (this.shanghaiRoundIndex >= 10) {
                            const eligible = this.players.filter((pl) => !pl.shanghaiEliminated);
                            const pool = eligible.length > 0 ? eligible : this.players;
                            const winner = pool.reduce((best, pl) =>
                                (!best || (pl.shanghaiScore || 0) > (best.shanghaiScore || 0)) ? pl : best, null);
                            if (winner) {
                                    this.winMessage = `🏆 ${winner.name} wins Shanghai with ${winner.shanghaiScore} points! Click New Match to start a new game.`;
                                    setTimeout(() => {
                        this.isGameOver = true;
                                        this.startShanghaiNewGame();
                                        this.winMessage = '';
                                    }, 1400);
                            }
                            return;
                        }
                    }

                    this.activePlayer = nextPlayer;

                    // Auto-skip eliminated players
                    let safety = 0;
                    while (this.players[this.activePlayer] && this.players[this.activePlayer].shanghaiEliminated && safety < totalPlayers * 10) {
                        const wasAtEnd = this.activePlayer === totalPlayers - 1;
                        this.activePlayer = (this.activePlayer + 1) % totalPlayers;
                        if (wasAtEnd || this.activePlayer === 0) {
                            this.shanghaiRoundIndex += 1;
                            if (this.shanghaiRoundIndex >= 10) {
                                const eligible = this.players.filter((pl) => !pl.shanghaiEliminated);
                                const pool = eligible.length > 0 ? eligible : this.players;
                                const winner = pool.reduce((best, pl) =>
                                    (!best || (pl.shanghaiScore || 0) > (best.shanghaiScore || 0)) ? pl : best, null);
                                if (winner) {
                                    this.winMessage = `🏆 ${winner.name} wins Shanghai with ${winner.shanghaiScore} points! Click New Match to start a new game.`;
                                    setTimeout(() => {
                        this.isGameOver = true;
                                        this.startShanghaiNewGame();
                                        this.winMessage = '';
                                    }, 1400);
                                }
                                return;
                            }
                        }
                        safety++;
                    }
                },

                /**
                 * Resets the Shanghai game to round 1 WITHOUT returning to the menu.
                 * All scores reset, eliminations cleared, stays on the scoring screen.
                 */
                startShanghaiNewGame() {
                    this.players = this.players.map((p) => ({
                        ...p,
                        shanghaiScore: 0,
                        shanghaiTurnDarts: 0,
                        shanghaiEliminated: false
                    }));
                    this.shanghaiRoundIndex = 0;
                    this.shanghaiMessage = '';
                    this.activePlayer = 0;
                    this.undoStack = [this.saveUndoStateSnapshot()];
                },

                /* ------------------------------------------------------------------
                   BOWTIE GAME RULES & SCORING ENGINE
                   ------------------------------------------------------------------ */
                /** Defines the 12 sequential rounds of BowTie */
                getBowTieRounds() {
                    return [
                        { key: 'free', label: 'Free', type: 'free' },
                        { key: '20', label: '20', type: 'target', target: 20 },
                        { key: '19', label: '19', type: 'target', target: 19 },
                        { key: 'treble', label: 'Treble (T)', type: 'anyTreble' },
                        { key: '18', label: '18', type: 'target', target: 18 },
                        { key: '17', label: '17', type: 'target', target: 17 },
                        { key: 'double', label: 'Double (D)', type: 'anyDouble' },
                        { key: '16', label: '16', type: 'target', target: 16 },
                        { key: '15', label: '15', type: 'target', target: 15 },
                        { key: '3color', label: '3 Color', type: 'threeColor' },
                        { key: 'bt', label: 'BowTie (BT)', type: 'bowtie' },
                        { key: 'bull', label: 'Bull (B)', type: 'bull' }
                    ];
                },

                /** Returns the round descriptor currently in progress */
                getCurrentBowTieRound() {
                    const rounds = this.getBowTieRounds();
                    return rounds[Math.min(this.bowTieRoundIndex || 0, rounds.length - 1)] || rounds[0];
                },

                /** Checks if a given target corresponds to the currently active BowTie round */
                isCurrentBowTieTarget(target) {
                    const active = this.getCurrentBowTieRound();
                    if (!active) return false;
                    const activeIndex = this.getBowTieRounds().findIndex((round) => round.key === active.key);
                    const targetIndex = this.getBowTieTargetIndex(target);
                    return activeIndex === targetIndex;
                },

                /** Returns index 0-11 for a target label in BowTie */
                getBowTieTargetIndex(target) {
                    const targets = [
                        'Free', 20, 19, 'Treble (T)', 18, 17, 'Double (D)',
                        16, 15, '3 Color', 'BowTie (BT)', 'Bull (B)'
                    ];
                    const token = String(target || '').trim();
                    return targets.findIndex((item) => String(item).trim() === token);
                },

                /** Splits players into rows of 4 for the BowTie scorecards grid */
                getBowTiePlayerRows() {
                    const rows = [];
                    for (let index = 0; index < this.players.length; index += 4) {
                        rows.push(this.players.slice(index, index + 4).map((player, offset) => ({
                            ...player,
                            index: index + offset
                        })));
                    }
                    return rows;
                },

                /** Appends a clicked target number to the BowTie round input */
                addBowTieRoundTarget(target) {
                    if (!this.isBowTieGameMode()) return;
                    this.bowTieMessage = '';
                    if (['Free', 'Treble (T)', 'Double (D)', '3 Color', 'BowTie (BT)'].includes(target)) return;

                    const normalizedTarget = typeof target === 'string' ? target.trim() : String(target);
                    const value = normalizedTarget === 'Bull (B)' || normalizedTarget === 'B' ? 25 : Number(normalizedTarget);
                    const current = (this.bowTieRoundInput || '').trim();
                    const token = normalizedTarget === 'Bull (B)' || normalizedTarget === 'B'
                        ? 'B'
                        : (normalizedTarget === 'Treble (T)' ? 'T' : (normalizedTarget === 'Double (D)' ? 'D' : (normalizedTarget === '3 Color' ? '3C' : (normalizedTarget === 'BT' ? 'BT' : (normalizedTarget === 'Free' ? 'FREE' : String(value))))));

                    this.bowTieRoundInput = current ? `${current} ${token}` : token;

                    if (Number.isFinite(value) && value > 0) {
                        this.bowTieDarts.push({
                            value,
                            multiplier: 1,
                            color: value === 25 ? 'green' : (value % 2 === 0 ? 'black' : 'red')
                        });
                    }
                },

                /** Clears the current round input and dart hits in BowTie */
                clearBowTieRoundInput() {
                    this.bowTieRoundInput = '';
                    this.bowTieDarts = [];
                    this.bowTieMessage = '';
                },

                /** Parses raw text input (e.g. '20 20 18' or 'T20 60') into structured dart objects */
                parseBowTieRoundInput() {
                    const raw = String(this.bowTieRoundInput || '').trim();
                    if (!raw) {
                        return this.bowTieDarts.slice();
                    }

                    const round = this.getCurrentBowTieRound();
                    const targetVal = round && (round.target !== undefined ? (round.target === 'B' ? 25 : Number(round.target)) : (round.type === 'bull' ? 25 : null));

                    return raw
                        .split(/[\s,+]+/)
                        .filter(Boolean)
                        .flatMap((token) => {
                            const normalized = token.toUpperCase().trim();
                            if (normalized === 'FREE') return [];
                            if (normalized === '3C' || normalized === '3-COLOR') return [];
                            if (normalized === 'BT') return [];
                            if (normalized === 'B' || normalized === 'BULL') return [{ value: 25, multiplier: 1, color: 'green' }];
                            if (normalized === 'T') return [];
                            if (normalized === 'D') return [];
                            if (normalized.startsWith('T')) return [{ value: Number(normalized.slice(1)) || 0, multiplier: 3, color: 'red' }];
                            if (normalized.startsWith('D')) return [{ value: Number(normalized.slice(1)) || 0, multiplier: 2, color: 'black' }];

                            if (/[*X]/.test(normalized)) {
                                const parts = normalized.split(/[*X]/).map((p) => p.trim());
                                if (parts.length === 2) {
                                    let val1 = parts[0] === 'B' ? 25 : Number(parts[0]);
                                    let val2 = parts[1] === 'B' ? 25 : Number(parts[1]);
                                    if (Number.isFinite(val1) && Number.isFinite(val2)) {
                                        if (val2 <= 3 && val1 > 3) {
                                            return [{ value: val1, multiplier: val2, color: val1 === 25 ? 'green' : (val1 % 2 === 0 ? 'black' : 'red') }];
                                        } else if (val1 <= 3 && val2 > 3) {
                                            return [{ value: val2, multiplier: val1, color: val2 === 25 ? 'green' : (val2 % 2 === 0 ? 'black' : 'red') }];
                                        } else {
                                            return [{ value: val1 * val2, multiplier: 1, color: 'red' }];
                                        }
                                    }
                                }
                            }

                            const value = Number(normalized);
                            if (!Number.isFinite(value) || value <= 0) return [];
