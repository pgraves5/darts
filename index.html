<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dart Games - Scoreboard</title>
    <!-- Tailwind CSS CDN for reactive, responsive utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN for lightweight, reactive component state management -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        /* ==========================================================================
           RESPONSIVE VIEWPORT & TOUCH STYLES
           ========================================================================== */
        /* Prevent elastic bouncing/overscroll on mobile browsers and disable text selection */
        body { 
            overscroll-behavior-y: none; 
            -webkit-user-select: none; 
            user-select: none; 
            min-height: 100vh; 
            min-height: 100dvh; 
        }

        /* Optimize touch response times on interactive elements */
        button, input, select { 
            touch-action: manipulation; 
        }

        /* Tactile feedback animation for on-screen numeric keypad buttons */
        .keypad-btn { 
            transition: transform 90ms ease; 
        }
        .keypad-btn:active { 
            transform: scale(0.95); 
        }

        /* Compact sizing overrides for mobile / small screen viewports */
        @media (max-width: 640px) {
            .game-board-area { padding: 0.5rem !important; }
            .compact-keypad { padding: 0.5rem !important; }
            .compact-keypad .keypad-btn { padding-top: 0.375rem !important; padding-bottom: 0.375rem !important; }
            .mobile-menu { padding: 1rem !important; justify-content: flex-start !important; }
            .mobile-menu h2 { margin-bottom: 0.75rem !important; }
            .mobile-menu select, .mobile-menu input { margin-bottom: 0.5rem !important; }
        }

        /* Compact vertical paddings for short viewports (landscape mobile, compact tablets) */
        @media (max-height: 700px) {
            .game-board-area { padding-top: 0.25rem !important; padding-bottom: 0.25rem !important; }
            .compact-keypad { padding-top: 0.375rem !important; padding-bottom: 0.375rem !important; }
            .compact-keypad .keypad-btn { padding-top: 0.25rem !important; padding-bottom: 0.25rem !important; }
        }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans h-screen h-[100dvh] flex flex-col overflow-hidden" x-data="dartApp()" x-init="setupPlayerNames()">

    <!-- ========================================================================
         HEADER BAR
         Displays the current match mode / rules and quick navigation actions
         ======================================================================== -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-2.5 flex justify-between items-center shrink-0">
        <div class="flex items-center space-x-3">
            <!-- Dynamic title: Shows mode and starting rules for X01, or game name for Cricket/BowTie (scaled by 20%) -->
            <h1 class="text-xl font-bold truncate" x-text="isX01GameMode() ? gameMode + ' - ' + startingMode : gameMode"></h1>
        </div>
        <div class="flex items-center space-x-2">
            <!-- HELP Button: Opens README.md located in the same directory as this HTML file -->
            <a href="README.md" target="_blank" rel="noopener noreferrer" class="bg-slate-700 hover:bg-slate-600 text-sm px-3.5 py-1.5 rounded font-bold transition-colors flex items-center justify-center text-white no-underline border border-slate-600 shadow">HELP</a>
            <!-- New Match Button: Navigates back to setup/menu screen to start a fresh game -->
            <button @click="resetMatch()" class="bg-blue-600 hover:bg-blue-500 text-sm px-3.5 py-1.5 rounded font-bold transition-colors shadow">New Match</button>
        </div>
    </header>

    <!-- ========================================================================
         MAIN CONTAINER
         Houses either the Setup/Menu view or the active Live Scoring interface
         ======================================================================== -->
    <main class="flex-1 flex flex-col overflow-hidden relative">

        <!-- ====================================================================
             1. SETUP / MENU SCREEN (screen === 'menu')
             Allows players to configure Game Mode, Starting In rules, Player Count,
             and customize Player Names before starting the match.
             ==================================================================== -->
        <div x-show="screen === 'menu'" class="mobile-menu absolute inset-0 bg-slate-900 z-20 p-6 flex flex-col justify-center max-w-md mx-auto w-full overflow-y-auto">
            <h2 class="text-2xl font-black mb-6 text-center text-red-500 tracking-wider">DART GAMES</h2>
            
            <!-- Game Mode Selector: X01 (101-601), Standard Cricket, 3-Way Cricket, BowTie -->
            <label class="text-sm text-slate-400 mb-1">Game Mode</label>
            <select x-model="gameMode" @change="handleGameModeChange()" class="bg-slate-800 border border-slate-700 rounded p-3 mb-4 text-white font-bold focus:border-red-500 outline-none">
                <option value="601">601</option>
                <option value="501">501</option>
                <option value="401">401</option>
                <option value="301">301</option>
                <option value="201">201</option>
                <option value="101">101</option>
                <option value="Cricket">Standard Cricket</option>
                <option value="3-Way Cricket">3-Way Cricket</option>
                <option value="BowTie">BowTie</option>
            </select>

            <!-- Starting Mode Selector (Straight-in vs Double-in) for X01 game modes -->
            <template x-if="isX01GameMode()">
                <div>
                    <label class="text-sm text-slate-400 mb-1">Starting Mode</label>
                    <select x-model="startingMode" class="bg-slate-800 border border-slate-700 rounded p-3 mb-4 text-white font-bold w-full focus:border-red-500 outline-none">
                        <option value="Straight-in">Straight-in</option>
                        <option value="Double-in">Double-in</option>
                    </select>
                </div>
            </template>

            <!-- Player Count Selector for games supporting variable counts (X01: 1-4, BowTie: 1-15) -->
            <template x-if="isX01GameMode() || isBowTieGameMode()">
                <div>
                    <label class="text-sm text-slate-400 mb-1">Players</label>
                    <select x-model="playerCount" @change="setupPlayerNames(false)" class="bg-slate-800 border border-slate-700 rounded p-3 mb-4 text-white font-bold w-full focus:border-red-500 outline-none">
                        <template x-for="n in getPlayerCountOptions()" :key="n">
                            <option :value="n" x-text="n + ' Player' + (n === 1 ? '' : 's')"></option>
                        </template>
                    </select>
                </div>
            </template>

            <!-- Player Name Configuration Grid:
                 Uses :key="gameMode + '-' + index" so when Game Mode changes, inputs re-mount
                 cleanly with the default names (P1, P2, etc.) -->
            <div :class="getPlayerNameSetupGridClasses()" class="grid gap-3 mb-4">
                <template x-for="(slot, index) in getPlayerSlots()" :key="gameMode + '-' + index">
                    <div>
                        <label class="text-xs text-slate-400 mb-1 block" x-text="'Player ' + (index + 1) + ' Name'">Player Name</label>
                        <input
                            type="text"
                            :maxlength="getPlayerNameMaxLength()"
                            :value="players[index]?.name || ''"
                            @input="setPlayerName(index, $event.target.value, $event)"
                            class="bg-slate-800 border border-slate-700 rounded p-2 text-white font-bold w-full uppercase focus:border-red-500 outline-none"
                        >
                    </div>
                </template>
            </div>

            <!-- Start Match Action: Initializes players and switches view to live scoring -->
            <button @click="startMatch()" class="w-full bg-red-600 hover:bg-red-500 font-black py-4 rounded-xl text-lg shadow-lg tracking-wide transition-colors">START MATCH</button>
        </div>

        <!-- ====================================================================
             2. LIVE SCORING INTERFACE (screen === 'scoring')
             Houses the scoreboard, active game matrix/guide, and game-specific keypad.
             ==================================================================== -->
        <div x-show="screen === 'scoring'" class="flex-1 flex flex-col h-full overflow-hidden">
            
            <!-- SCOREBOARD HEADER (Used for X01 and Cricket games; BowTie uses custom cards; scaled 20%) -->
            <template x-if="!isBowTieGameMode()">
                <div :class="(isX01GameMode() ? 'grid-cols-' + players.length : 'grid ' + getPlayerGridClasses()) + ' bg-slate-800 border-b border-slate-700 text-center shrink-0 grid'" class="grid grid-cols-2">
                    <template x-for="(player, index) in players" :key="index">
                        <div
                            :class="(activePlayer === index ? 'bg-slate-700/80 border-b-4 border-red-500' : 'opacity-70') + (isX01GameMode() ? ' p-2' : (isCricketGameMode() ? ' p-3' : ' p-3.5'))"
                            class="transition-all border-r border-slate-700 last:border-r-0"
                        >
                            <!-- Player Name (scaled 20%) -->
                            <div class="text-sm font-bold uppercase tracking-wider text-slate-300 truncate" x-text="player.name"></div>
                            <!-- Current Score: Remaining points for X01, Cricket points for Cricket (scaled 20%) -->
                            <div :class="(activePlayer === index ? 'font-black' : 'font-normal') + (isX01GameMode() ? ' text-[2.2rem] my-0.5' : (isCricketGameMode() ? ' text-[2.5rem] my-0.5' : ' text-[44px] my-1'))" x-text="isX01GameMode() ? player.score : player.cricketScore"></div>
                            <!-- 3-Dart Running Average (X01 games only; scaled 20%) -->
                            <template x-if="isX01GameMode()">
                                <div class="text-xs text-slate-300">Avg: <span class="font-bold" x-text="getPlayerAvg(index)"></span></div>
                            </template>
                        </div>
                    </template>
                </div>
            </template>

            <!-- DYNAMIC GAME BOARD / STATS DISPLAY AREA -->
            <div class="game-board-area flex-1 p-1 sm:p-2 flex flex-col justify-start items-center overflow-y-auto min-h-0">
                
                <!-- X01 CHECKOUT GUIDE (scaled 20%)
                     Suggests optimal 2-dart and 3-dart double-finish routes for remaining score <= 170 -->
                <template x-if="isX01GameMode()">
                    <div class="text-center mb-1">
                        <div class="text-sm text-slate-400 uppercase tracking-widest mb-0">Checkout Suggestion</div>
                        <div class="text-2xl font-bold text-yellow-400" x-text="checkoutInfo().summary"></div>
                        <div class="mt-0.5 text-base space-y-0 text-slate-200">
                            <div x-show="checkoutInfo().twoDart" x-text="'2 Dart: ' + checkoutInfo().twoDart"></div>
                            <div x-show="checkoutInfo().threeDart" x-text="'3 Dart: ' + checkoutInfo().threeDart"></div>
                        </div>
                    </div>
                </template>

                <!-- CRICKET MATRIX BOARD (scaled 20%)
                     Displays marks for targets: 20, 19, 18, 17, 16, 15, and Bullseye (B).
                     Includes Triple (T), Single (number), and Double (D) hit buttons. -->
                <template x-if="isCricketGameMode()">
                    <div class="w-full max-w-[538px] bg-slate-800 rounded-xl overflow-hidden border border-slate-700 text-lg mb-0 shadow">
                        <!-- Column Headers: Player Names & Target Label (scaled 20%) -->
                        <div class="grid text-center font-bold text-[26px] uppercase tracking-wide bg-slate-700 p-2.5" :style="'grid-template-columns: repeat(' + players.length + ', minmax(0, 1fr)) 1.2fr'">
                            <template x-for="(player, index) in players" :key="index">
                                <div class="px-1"><span x-text="player.name"></span></div>
                            </template>
                            <div class="text-center">Target</div>
                        </div>

                        <!-- Target Rows: Mark indicators and interactive hit buttons (scaled 20%) -->
                        <template x-for="target in [20, 19, 18, 17, 16, 15, 'B']">
                            <div class="grid px-2.5 py-0.5 text-center border-t border-slate-700 items-center font-mono font-bold gap-1" :style="'grid-template-columns: repeat(' + players.length + ', minmax(0, 1fr)) 1.2fr'">
                                <!-- Player Marks Column: Displays -, /, X, or ⨷ (closed; scaled 20%) -->
                                <template x-for="(player, index) in players" :key="index">
                                    <div class="min-h-[36px] flex items-center justify-center text-blue-400 text-[26px]">
                                        <span x-text="renderMarks(player.marks[target])"></span>
                                    </div>
                                </template>
                                <!-- Hit Controls Column: T (Triple), Target (Single), D (Double; scaled 20%) -->
                                <div class="grid grid-cols-[34px_48px_34px] items-center justify-items-center justify-end gap-1.5 sm:gap-2.5 text-slate-200 bg-slate-900 py-1 rounded w-full ml-auto text-center">
                                    <!-- Triple button (not available for Bullseye) -->
                                    <template x-if="target !== 'B'">
                                        <button @click="hitCricket(activePlayer, target, 3)" class="w-[34px] h-[34px] bg-slate-700 hover:bg-slate-600 rounded text-[29px] flex items-center justify-center">T</button>
                                    </template>
                                    <template x-if="target === 'B'">
                                        <div class="w-[34px] h-[34px]"></div>
                                    </template>
                                    <!-- Single hit button (displays target number or 'B') -->
                                    <button @click="hitCricket(activePlayer, target, 1)" class="w-[48px] h-[38px] bg-slate-900 hover:bg-slate-700 rounded text-[31px] flex items-center justify-center" x-text="target"></button>
                                    <!-- Double hit button -->
                                    <button @click="hitCricket(activePlayer, target, 2)" class="w-[34px] h-[34px] bg-slate-700 hover:bg-slate-600 rounded text-[29px] flex items-center justify-center">D</button>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- CRICKET KEYPAD / ACTION CONTROLS (scaled 20%)
                     Contains UNDO and ENTER buttons, plus the reserved message banner.
                     Maintains min-h-[1.5rem] and \u00A0 by default so buttons stay large. -->
                <template x-if="isCricketGameMode()">
                    <div class="w-full max-w-[538px] mt-1 mb-1">
                        <!-- Alert / Notification banner (e.g. closed target alert, 3-dart hit limit) -->
                        <div
                            class="w-full text-center text-red-500 font-bold text-sm mb-1 min-h-[1.5rem] flex items-center justify-center"
                            x-text="cricketHitLimitMessage || '\u00A0'"
                        ></div>
                        <!-- Undo and Enter actions (scaled 20%) -->
                        <div class="grid grid-cols-2 gap-2.5">
                            <button @click="undo()" class="bg-yellow-600 hover:bg-yellow-500 font-bold py-3 rounded-xl text-lg transition-colors shadow">UNDO</button>
                            <button @click="submitCricketTurn()" class="bg-green-600 hover:bg-green-500 font-bold py-3 rounded-xl text-lg transition-colors shadow">ENTER</button>
                        </div>
                    </div>
                </template>

                <!-- BOWTIE GAME BOARD & KEYPAD (scaled 20%)
                     BowTie consists of 12 rounds: Free, 20, 19, Treble, 18, 17, Double, 16, 15, 3 Color, BT, Bull.
                     Scores halve if a player fails to score in a round. -->
                <template x-if="isBowTieGameMode()">
                    <div class="w-full max-w-[614px] bg-slate-800 rounded-xl border border-slate-700 p-2.5 sm:p-3.5 text-base mb-2 mx-auto shadow">
                        <!-- Active Player and Current Target Round indicator (scaled 20%) -->
                        <div class="mt-1 text-lg leading-6 text-slate-300 flex items-center gap-3.5 whitespace-nowrap">
                            <span>Active player: <span class="text-red-500 font-black" x-text="players[activePlayer].name"></span></span>
                            <span>Target Round: <span class="text-red-500 font-black" x-text="getCurrentBowTieRound().label"></span></span>
                        </div>

                        <div class="mt-2.5 grid grid-cols-[140px_minmax(0,1fr)] sm:grid-cols-[154px_minmax(0,1fr)] gap-2.5 items-start">
                            <!-- Left Column: 12 BowTie Targets list with active round highlight (scaled 20%) -->
                            <div class="space-y-1.5 rounded-lg border border-slate-700 bg-slate-900/50 p-2">
                                <div class="px-1 text-[11px] uppercase tracking-[0.18em] text-slate-400">TARGETS</div>
                                <template x-for="(target, index) in [
                                    'Free', 20, 19, 'Treble (T)', 18, 17, 'Double (D)',
                                    16, 15, '3 Color', 'BowTie (BT)', 'Bull (B)'
                                ]" :key="index">
                                    <button
                                        type="button"
                                        :disabled="['Free', 'Treble (T)', 'Double (D)', '3 Color', 'BowTie (BT)'].includes(target)"
                                        @click="if (!['Free', 'Treble (T)', 'Double (D)', '3 Color', 'BowTie (BT)'].includes(target)) addBowTieRoundTarget(target)"
                                        :class="[
                                            'w-full whitespace-nowrap rounded-md border border-slate-600 px-1.5 py-2 text-xs sm:text-[13px] font-black text-slate-100 hover:brightness-110 focus:outline-none active:scale-[0.98] bg-slate-700/90',
                                            isCurrentBowTieTarget(target) ? 'bg-red-300 text-red-950 border-red-200 shadow-[0_0_0_2px_rgba(254,202,202,0.9),0_0_16px_rgba(239,68,68,0.7)] ring-2 ring-red-200/90' : '',
                                            ['Free', 'Treble (T)', 'Double (D)', '3 Color', 'BowTie (BT)'].includes(target) ? 'opacity-50 cursor-not-allowed' : ''
                                        ]"
                                        x-text="target"
                                    ></button>
                                </template>
                            </div>

                            <!-- Right Column: Player scores grid, BowTie keypad, and turn input -->
                            <div class="flex flex-col">
                                <!-- Multi-player Scorecards Grid (scaled 20%) -->
                                <div class="grid gap-2">
                                    <template x-for="(row, rowIndex) in getBowTiePlayerRows()" :key="rowIndex">
                                        <div class="grid gap-2" :style="'grid-template-columns: repeat(' + row.length + ', minmax(0, 1fr))'">
                                            <template x-for="(player, index) in row" :key="player.index">
                                                <div :class="activePlayer === player.index ? 'bg-slate-700 border-t-4 border-red-500' : 'bg-slate-900/70'" class="min-w-0 rounded-lg border border-slate-700 px-1 py-2 text-center">
                                                    <div class="text-[11px] font-bold uppercase tracking-wide text-slate-400 truncate" x-text="player.name"></div>
                                                    <div
                                                        class="mt-1 font-black tracking-tight leading-none whitespace-nowrap"
                                                        :class="(activePlayer === player.index ? 'font-black ' : 'font-normal ') + (String(player.bowTieScore).length >= 4 ? 'text-lg' : (String(player.bowTieScore).length === 3 ? 'text-xl' : 'text-3xl'))"
                                                        x-text="player.bowTieScore"
                                                    ></div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>

                                <!-- BowTie Numeric Keypad (4 columns x 4 rows; scaled 20%):
                                     Col 1-3: Numbers 0-9 and operators (+, *)
                                     Col 4: Row 1 = Del, Row 2 = CLEAR, Row 3 = UNDO, Row 4 = Spacer -->
                                <div class="grid grid-cols-4 gap-2 my-2">
                                    <button @click="pressKey('1')" class="keypad-btn bg-slate-700 hover:bg-slate-600 text-base font-bold py-2 rounded-lg">1</button>
                                    <button @click="pressKey('2')" class="keypad-btn bg-slate-700 hover:bg-slate-600 text-base font-bold py-2 rounded-lg">2</button>
                                    <button @click="pressKey('3')" class="keypad-btn bg-slate-700 hover:bg-slate-600 text-base font-bold py-2 rounded-lg">3</button>
                                    <button @click="pressKey('back')" class="keypad-btn bg-red-900/60 hover:bg-red-800 text-xs font-bold py-2 rounded-lg text-red-300">Del</button>

                                    <button @click="pressKey('4')" class="keypad-btn bg-slate-700 hover:bg-slate-600 text-base font-bold py-2 rounded-lg">4</button>
                                    <button @click="pressKey('5')" class="keypad-btn bg-slate-700 hover:bg-slate-600 text-base font-bold py-2 rounded-lg">5</button>
                                    <button @click="pressKey('6')" class="keypad-btn bg-slate-700 hover:bg-slate-600 text-base font-bold py-2 rounded-lg">6</button>
                                    <button @click="clearBowTieRoundInput()" class="keypad-btn bg-slate-600 hover:bg-slate-500 text-xs font-bold py-2 rounded-lg text-slate-100">CLEAR</button>

                                    <button @click="pressKey('7')" class="keypad-btn bg-slate-700 hover:bg-slate-600 text-base font-bold py-2 rounded-lg">7</button>
                                    <button @click="pressKey('8')" class="keypad-btn bg-slate-700 hover:bg-slate-600 text-base font-bold py-2 rounded-lg">8</button>
                                    <button @click="pressKey('9')" class="keypad-btn bg-slate-700 hover:bg-slate-600 text-base font-bold py-2 rounded-lg">9</button>
                                    <button @click="undo()" class="keypad-btn bg-yellow-600 hover:bg-yellow-500 text-xs font-bold py-2 rounded-lg text-yellow-50">UNDO</button>

                                    <button @click="pressKey('+')" class="keypad-btn bg-slate-700 hover:bg-slate-600 text-base font-bold py-2 rounded-lg text-yellow-300">+</button>
                                    <button @click="pressKey('0')" class="keypad-btn bg-slate-700 hover:bg-slate-600 text-base font-bold py-2 rounded-lg">0</button>
                                    <button @click="pressKey('*')" class="keypad-btn bg-slate-700 hover:bg-slate-600 text-base font-bold py-2 rounded-lg text-yellow-300">×</button>
                                    <div class="keypad-btn"></div>
                                </div>

                                <!-- BowTie Round Input Field (scaled 20%) -->
                                <div>
                                    <label class="block text-[11px] uppercase tracking-[0.18em] text-slate-400 mb-1">Score for round</label>
                                    <input
                                        type="text"
                                        x-model="bowTieRoundInput"
                                        @input="bowTieMessage = ''"
                                        @keydown.enter.prevent="submitBowTieTurn()"
                                        placeholder="20 20 18"
                                        class="w-full rounded-md border border-slate-600 bg-slate-950 px-2.5 py-2 text-base font-mono text-white placeholder:text-slate-500 focus:border-yellow-400 outline-none"
                                    />
                                </div>
                                <!-- BowTie Validation / Warning Message Area (scaled 20%) -->
                                <div
                                    class="w-full text-center text-red-500 font-bold text-sm min-h-[1.5rem] flex items-center justify-center mt-1"
                                    x-text="bowTieMessage || '\u00A0'"
                                ></div>
                                <!-- BowTie Submit Button (scaled 20%) -->
                                <div class="mt-1">
                                    <button @click="submitBowTieTurn()" class="w-full bg-green-600 hover:bg-green-500 font-bold py-2.5 rounded-lg text-base tracking-wide shadow transition-colors">ENTER</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- CURRENT TURN INPUT DISPLAY (X01 games only; scaled 20%)
                     Displays current entered score expression, turn total, and new remaining score preview -->
                <template x-if="!isCricketGameMode() && !isBowTieGameMode()">
                    <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-2 sm:p-2.5 w-full max-w-md text-center shadow-inner">
                        <div class="text-sm text-slate-400 uppercase mb-0.5">Current Turn Score</div>
                        <!-- Current unsubmitted turn score expression (scaled 20%) -->
                        <div class="text-5xl sm:text-6xl font-mono font-black text-red-500 tracking-widest h-12 sm:h-14" x-text="currentTurnScore || '0'"></div>
                        <!-- Turn Total and New Score Preview Boxes (scaled 20%) -->
                        <div class="mt-1.5 grid grid-cols-2 gap-1.5 text-left">
                            <div class="bg-slate-900/60 rounded-lg p-2.5">
                                <div class="text-xs uppercase tracking-wider text-slate-400">Turn Total</div>
                                <div class="text-lg font-mono font-bold text-red-400" x-text="turnTotalPreview()"></div>
                            </div>
                            <div class="bg-slate-900/60 rounded-lg p-2.5">
                                <div class="text-xs uppercase tracking-wider text-slate-400">New Score</div>
                                <div class="text-lg font-mono font-bold text-green-400" x-text="newScorePreview()"></div>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- X01 NUMERIC KEYPAD & TURN CONTROLS (scaled 20%)
                     Provides touch-friendly numeric entry (1-9, 0, +, *), Del, UNDO, MISS, BUST, ENTER,
                     a dedicated status/error display line, and quick-score preset buttons. -->
                <template x-if="isX01GameMode()">
                    <div class="compact-keypad w-full max-w-[538px] mt-1 bg-slate-800/60 border-t border-slate-700 px-1.5 py-1.5 rounded-lg shrink-0">
                        <div class="max-w-[538px] mx-auto">
                            <!-- Keypad Grid (4 columns; scaled 20%) -->
                            <div class="grid grid-cols-4 gap-2 mb-2">
                                <button @click="pressKey('1')" class="keypad-btn bg-slate-700 hover:bg-slate-600 text-lg font-bold py-2.5 rounded-lg">1</button>
                                <button @click="pressKey('2')" class="keypad-btn bg-slate-700 hover:bg-slate-600 text-lg font-bold py-2.5 rounded-lg">2</button>

                                    <button @click="setScore(81)" class="keypad-btn bg-sky-500/20 hover:bg-sky-500/30 text-[10px] font-bold py-2 rounded-lg text-sky-200 border border-sky-400/20">81</button>

            <!-- BOTTOM UTILITY BAR -->
            <div class="flex justify-end items-center px-3 py-1 border-t border-slate-700 text-xs shrink-0">
