                            if (targetVal && value !== targetVal && value % targetVal === 0 && (value / targetVal) <= 3) {
                                const mult = value / targetVal;
                                return [{
                                    value: targetVal,
                                    multiplier: mult,
                                    color: targetVal === 25 ? 'green' : (targetVal % 2 === 0 ? 'black' : 'red')
                                }];
                            }

                            return [{
                                value: value,
                                multiplier: 1,
                                color: value === 25 ? 'green' : (value % 2 === 0 ? 'black' : 'red')
                            }];
                        })
                        .filter((dart) => Number.isFinite(dart.value) && dart.value > 0);
                },

                /** Records a dart thrown in BowTie; auto-submits turn after 3 darts */
                bowTieAddDart(value, multiplier = 1) {
                    if (!this.isBowTieGameMode()) return;
                    this.bowTieDarts.push({ 
                        value: value === null ? 0 : Number(value), 
                        multiplier: Number(multiplier) || 0, 
                        color: value === null ? 'miss' : (value === 25 || value === 50 ? 'green' : (value % 2 === 0 ? 'black' : 'red')) 
                    });
                    if (this.bowTieDarts.length >= 3) {
                        this.submitBowTieTurn();
                    }
                },

                /** BowTie penalty rule: Halves player score (rounding up if odd) on missed target round */
                rollBowTiePenalty(player) {
                    const total = Number(player.bowTieScore || 0);
                    const adjusted = total % 2 === 1 ? total + 1 : total;
                    return Math.floor(adjusted / 2);
                },

                /** Resolves points scored or penalty applied for a BowTie round */
                resolveBowTieRound(player, round, darts) {
                    const current = Number(player.bowTieScore || 0);
                    const sumPoints = (items) => items.reduce((total, dart) => total + (Number(dart.value) || 0) * (Number(dart.multiplier) || 1), 0);

                    // Free Round: Any hits score points; no hits applies penalty
                    if (round.type === 'free') {
                        const hits = darts.filter((dart) => dart && Number(dart.value) > 0);
                        if (!hits.length) return this.rollBowTiePenalty(player);
                        return current + sumPoints(hits);
                    }

                    // Target Rounds (20, 19, 18, 17, 16, 15): Only specified target hits count
                    if (round.type === 'target') {
                        const hits = darts.filter((dart) => Number(dart.value) === Number(round.target));
                        if (!hits.length) return this.rollBowTiePenalty(player);
                        return current + sumPoints(hits);
                    }

                    // Special Rounds (Treble, Double, 3 Color, BowTie)
                    if (round.type === 'anyTreble' || round.type === 'anyDouble' || round.type === 'threeColor' || round.type === 'bowtie') {
                        const enteredPoints = darts.reduce((total, dart) => total + (Number(dart.value) || 0) * (Number(dart.multiplier) || 1), 0);
                        if (enteredPoints <= 0) return this.rollBowTiePenalty(player);
                        if (round.type === 'anyTreble' && enteredPoints % 3 !== 0) return this.rollBowTiePenalty(player);
                        if (round.type === 'anyDouble' && enteredPoints % 2 !== 0) return this.rollBowTiePenalty(player);
                        return current + enteredPoints;
                    }

                    // Bullseye Round: Only 25 (Single Bull) and 50 (Double Bull) count
                    if (round.type === 'bull') {
                        const hits = darts.filter((dart) => [25, 50].includes(Number(dart.value)));
                        if (!hits.length) return this.rollBowTiePenalty(player);
                        return current + sumPoints(hits);
                    }

                    return current;
                },

                /**
                 * Submits the active player's BowTie turn.
                 * Enforces the max score guard (> 180) across all games.
                 */
                submitBowTieTurn() {
                    if (!this.isBowTieGameMode()) return;
                    const player = this.players[this.activePlayer];
                    if (!player) return;

                    const round = this.getCurrentBowTieRound();
                    const darts = this.parseBowTieRoundInput();
                    const sumPoints = (items) => items.reduce((total, dart) => total + (Number(dart.value) || 0) * (Number(dart.multiplier) || 1), 0);
                    const enteredPoints = sumPoints(darts);

                    // Max score validation: A 3-dart turn score cannot exceed 180
                    if (enteredPoints > 180) {
                        this.bowTieMessage = 'The max score is 180, please correct the score and try ENTER again';
                        return;
                    }

                    this.bowTieMessage = '';
                    this.saveUndoState();
                    const actingPlayer = this.activePlayer;
                    const prevScore = Number(player.bowTieScore || 0);
                    const trustedSpecialRound = ['anyTreble', 'anyDouble', 'threeColor', 'bowtie'].includes(round.type);

                    if (trustedSpecialRound) {
                        const trebleValid = round.type !== 'anyTreble' || enteredPoints % 3 === 0;
                        const doubleValid = round.type !== 'anyDouble' || enteredPoints % 2 === 0;

                        if (enteredPoints > 0 && trebleValid && doubleValid) {
                            player.bowTieScore = Number(player.bowTieScore || 0) + enteredPoints;
                        } else {
                            player.bowTieScore = this.rollBowTiePenalty(player);
                        }
                    } else {
                        player.bowTieScore = this.resolveBowTieRound(player, round, darts);
                    }

                    this.clearScoreFlash();

                    this.bowTieDarts = [];
                    this.bowTieRoundInput = '';
                    this.activePlayer = (this.activePlayer + 1) % this.players.length;
                    if (this.activePlayer === 0) {
                        this.bowTieRoundIndex += 1;
                    }

                    // Game over check when all 12 rounds are finished
                    if (this.bowTieRoundIndex >= this.getBowTieRounds().length) {
                        const winner = this.players.reduce((best, currentPlayer) => {
                            if (!best || Number(currentPlayer.bowTieScore) > Number(best.bowTieScore)) return currentPlayer;
                            return best;
                        }, null);
                        if (winner) {
                            this.winMessage = `${winner.name} wins BowTie with ${winner.bowTieScore} points! Click New Match to start a new game.`;
                            // Show the win message in the message space, then reset for another game
                        this.isGameOver = true;
                            setTimeout(() => {
                                this.players = this.players.map((pl) => ({
                                    ...pl,
                                    bowTieScore: 0,
                                    turnDarts: 0
                                }));
                                this.activePlayer = 0;
                                this.bowTieRoundIndex = 0;
                                this.bowTieDarts = [];
                                this.bowTieRoundInput = '';
                                this.bowTieMessage = '';
                                this.winMessage = '';
                                this.undoStack = [this.saveUndoStateSnapshot()];
                            }, 1400);
                        }
                    }
                },

                /* ------------------------------------------------------------------
                   KEYPAD & TURN SCORING LOGIC (X01 & GENERAL)
                   ------------------------------------------------------------------ */
                /**
                 * Handles on-screen numeric keypad input (digits 0-9, backspace, operators +, *).
                 * Supports both BowTie and X01 active inputs.
                 */
                pressKey(val) {
if (this.isGameOver) {
                        return;
                    }
                    if (this.isBowTieGameMode()) {
                        this.bowTieMessage = '';
                        if (val === 'back') {
                            this.bowTieRoundInput = (this.bowTieRoundInput || '').slice(0, -1);
                            return;
                        }

                        if (!/[0-9+*xX]/.test(val)) return;

                        const sanitized = (val.toLowerCase() === 'x' || val === '*') ? '*' : val;
                        const current = String(this.bowTieRoundInput || '');
                        const lastChar = current.slice(-1);

                        // Prevent invalid operator repetition
                        if (sanitized === '*') {
                            if (!current || /[+*]/.test(lastChar)) return;
                        } else if (sanitized === '+') {
                            if (!current || /[+*]/.test(lastChar)) return;
                        }

                        this.bowTieRoundInput = current + sanitized;
                        return;
                    }

                    // X01 Keypad Input Handling
                    if (val === 'back') {
                        this.currentTurnScore = this.currentTurnScore.slice(0, -1);
                        return;
                    }

                    if (!/[0-9+*xX]/.test(val)) return;

                    const sanitized = val.toLowerCase() === 'x' ? '*' : val;
                    const current = this.currentTurnScore;
                    const lastChar = current.slice(-1);

                    if (sanitized === '*') {
                        if (!current || /[+*]/.test(lastChar)) return;
                    } else if (sanitized === '+') {
                        if (!current || /[+*]/.test(lastChar)) return;
                    } else {
                        if (current === '0' && sanitized === '0') return;
                    }

                    this.currentTurnScore += sanitized;
                },

                /**
                 * Evaluates the active mathematical score expression (e.g. '20*3 + 19').
                 */
                evaluateTurnScore() {
                    const expr = this.currentTurnScore.replace(/x/gi, '*');
                    if (!expr) return 0;

                    try {
                        const value = Function(`"use strict"; return (${expr});`)();
                        if (!Number.isFinite(value)) return 0;
                        return Math.max(0, value);
                    } catch (error) {
                        return 0;
                    }
                },

                /** Computes turn total preview string for the score box */
                turnTotalPreview() {
                    const total = this.evaluateTurnScore();
                    return this.currentTurnScore ? total.toString() : '0';
                },

                /** Computes new remaining score preview for the active player, indicating 'Bust' if invalid */
                newScorePreview() {
                    const p = this.players[this.activePlayer];
                    if (!this.currentTurnScore) {
                        return p.score;
                    }

                    const total = this.evaluateTurnScore();
                    const next = p.score - total;
                    // A score that exactly reaches 0 is a leg win, not a bust.
                    // Once the leg is won, never show 'Bust' in the new score box.
                    if (p.score === 0) {
                        return 0;
                    }
                    // Bust only when the remaining score would drop below 0 or land on 1.
                    if (next < 0 || next === 1) {
                        return 'Bust';
                    }
                    return next;
                },

                /** Direct preset score submission (e.g. clicking 26, 41, 60, etc.) */
                setScore(num) {
                    this.currentTurnScore = num.toString();
                    this.submitX01();
                },

                /** Dedicated bust button action (submits 0 score) */
                bustTurn() {
                    this.currentTurnScore = '0';
                    this.submitX01();
                },

                /**
                 * Submits the active player's X01 turn score.
                 * Enforces the max score guard (> 180), bust rules, and leg win conditions.
                 */
                submitX01() {
                    let pts = this.evaluateTurnScore();
                    // Max score validation: A 3-dart turn score cannot exceed 180
                    if (pts > 180) {
                        this.x01BustMessage = 'The max score is 180, please correct the score and try ENTER again';
                        return;
                    }

                    this.saveUndoState();
                    const actingPlayer = this.activePlayer;
                    let p = this.players[actingPlayer];
                    
                    // Validate standard X01 Bust rules (score cannot drop below 0 or equal 1)
                    if (p.score - pts < 0 || p.score - pts === 1) {
                        pts = 0; // Turn scores 0 points on bust
                        this.x01BustMessage = 'You Busted....use UNDO to correct this if appropriate.';
                    } else {
                        // Message persists until another button is clicked (ENTER or UNDO)
                    }

                    this.lastTurn = { player: actingPlayer, pts: pts };
                    p.history.push({ pts: pts, remaining: p.score - pts });
                    p.score -= pts;
                    this.clearScoreFlash();

                    // Leg Win Condition: Player reaches exactly 0
                    if (p.score === 0) {
                        this.winMessage = `${p.name} WINS THE LEG! Click New Match to start a new game.`;
                        this.isGameOver = true;  // Disable buttons after win
                        // Show the win message in the message space - persists until NEW MATCH is hit
                        this.saveUndoStateSnapshot();
                        return;
                    }

                    this.currentTurnScore = '';
                    this.activePlayer = (this.activePlayer + 1) % this.players.length;
                },

                /** Calculates 3-dart running average for an X01 player */
                getPlayerAvg(idx) {
                    let p = this.players[idx];
                    if (p.history.length === 0) return '0.00';
                    let totalPts = p.history.reduce((acc, curr) => acc + curr.pts, 0);
                    let avg = (totalPts / (p.history.length * 3)) * 3;
                    return avg.toFixed(2);
                },

                /** Returns the most recent completed turn score for an X01 player */
                getPlayerLastTurnScore(idx) {
                    const p = this.players[idx];
                    if (!p || !Array.isArray(p.history) || p.history.length === 0) return '-';
                    return p.history[p.history.length - 1].pts;
                },

                /* ------------------------------------------------------------------
                   X01 CHECKOUT SUGGESTION ENGINE
                   ------------------------------------------------------------------ */
                /** Returns checkout guidance object for the current preview score */
                checkoutInfo() {
                    return this.getCheckout(this.newScorePreview() === 'Bust' ? this.players[this.activePlayer].score : this.newScorePreview());
                },

                /** Calculates 2-dart and 3-dart double-finish routes for score <= 170 */
                getCheckout(score) {
                    const remaining = Number(score);
                    if (!Number.isFinite(remaining) || remaining <= 1 || remaining > 170) {
                        return { summary: 'Build Score', oneDart: '', twoDart: '', threeDart: '' };
                    }

                    const throwOptions = [];
                    for (let n = 1; n <= 20; n++) {
                        throwOptions.push({ value: n, label: String(n) });
                        throwOptions.push({ value: n * 2, label: `D${n}` });
                        throwOptions.push({ value: n * 3, label: `T${n}` });
                    }
                    throwOptions.push({ value: 25, label: 'Bull' });
                    throwOptions.push({ value: 50, label: 'DBull' });
                    throwOptions.sort((a, b) => b.value - a.value);

                    const isValidFinish = (option) => {
                        if (!option) return false;
                        return option.label === 'DBull' || option.label.startsWith('D');
                    };

                    const priorityScore = (route) => {
                        const routeText = route.map((item) => item.label).join(' ');
                        if (remaining === 41) {
                            if (routeText === '1 D20') return 0;
                            if (routeText === '9 D16') return 1;
                        }

                        const total = route.reduce((sum, item) => sum + item.value, 0);
                        if ([40, 32, 16].includes(total) && route.length === 1) return 0;

                        const subtotal = route.slice(0, -1).reduce((sum, item) => sum + item.value, 0);
                        if ([40, 32, 16].includes(subtotal)) return 0;
                        return 1;
                    };

                    const findExactCheckout = (dartCount) => {
                        const matches = [];
                        const seen = new Set();

                        const search = (target, combo, depth) => {
                            if (depth === dartCount) {
                                if (target === 0 && combo.length === dartCount && isValidFinish(combo[combo.length - 1])) {
                                    const route = combo.map((t) => t.label);
                                    const key = route.join('-');
                                    if (!seen.has(key)) {
                                        seen.add(key);
                                        matches.push({ route: route.join(' '), throws: combo });
                                    }
                                }
                                return;
                            }

                            for (const option of throwOptions) {
                                const nextTarget = target - option.value;
                                if (nextTarget < 0) continue;

                                if (depth === dartCount - 1) {
                                    if (nextTarget === 0 && isValidFinish(option)) {
                                        const fullCombo = [...combo, option];
                                        const route = fullCombo.map((t) => t.label);
                                        const key = route.join('-');
                                        if (!seen.has(key)) {
                                            seen.add(key);
                                            matches.push({ route: route.join(' '), throws: fullCombo });
                                        }
                                    }
                                    continue;
                                }

                                search(nextTarget, [...combo, option], depth + 1);
                            }
                        };

                        search(remaining, [], 0);
                        return matches.sort((a, b) => {
                            const diff = priorityScore(a.throws) - priorityScore(b.throws);
                            if (diff !== 0) return diff;
                            return a.route.localeCompare(b.route);
                        }).map((match) => match.route);
                    };

                    // Check 1-dart checkout first (must be a valid double finish exactly equal to remaining)
                    const oneDartOption = throwOptions.find((opt) => opt.value === remaining && isValidFinish(opt));
                    const oneDart = oneDartOption ? oneDartOption.label : '';
                    const twoDart = findExactCheckout(2)[0] || '';
                    const threeDart = findExactCheckout(3)[0] || '';

                    if (oneDart) {
                        return { summary: '1-Dart checkout', oneDart, twoDart, threeDart };
                    }
                    if (twoDart && threeDart) {
                        return { summary: 'Checkout route', oneDart: '', twoDart, threeDart };
                    }
                    if (twoDart) {
                        return { summary: '2-Dart checkout', oneDart: '', twoDart, threeDart };
                    }
                    if (threeDart) {
                        return { summary: '3-Dart checkout', oneDart: '', twoDart, threeDart };
                    }
                    return { summary: 'Standard route available', oneDart: '', twoDart, threeDart };
                },

                /* ------------------------------------------------------------------
                   CRICKET GAME RULES & SCORING ENGINE
                   ------------------------------------------------------------------ */
                /**
                 * Converts numerical marks count into traditional Cricket mark glyphs:
                 * 0 = '-' (empty)
                 * 1 = '/' (single slash)
                 * 2 = 'X' (cross)
                 * 3+ = '⨷' (closed circle with cross)
                 */
                renderMarks(marks) {
                    if (marks === 0) return '-';
                    if (marks === 1) return '/';
                    if (marks === 2) return 'X';
                    return '⨷';
                },

                /** Returns extra points scored on an open number for Cricket */
                getCricketExtraScore(playerIndex, target) {
                    const player = this.players[playerIndex];
                    const otherIndex = playerIndex === 0 ? 1 : 0;
                    const playerMarks = player.marks[target] || 0;
                    const otherMarks = this.players[otherIndex].marks[target] || 0;
                    const targetValue = target === 'B' ? 25 : Number(target);

                    if (playerMarks < 3 || otherMarks >= 3) return '';

                    const extraMarks = Math.max(0, playerMarks - 3);
                    return extraMarks > 0 ? String(extraMarks * targetValue) : '';
                },

                /** Provides feedback string if a player scores a large number of hits */
                getCricketHitFeedback(playerIndex) {
                    const player = this.players[playerIndex];
                    const totalClosedMarks = [20, 19, 18, 17, 16, 15, 'B'].reduce((sum, target) => {
                        const closedIndexes = this.players
                            .map((candidate, index) => ((candidate.marks[target] || 0) >= 3 ? index : -1))
                            .filter((index) => index !== -1);

                        if (closedIndexes.length !== 1) return sum;
                        const winnerIndex = closedIndexes[0];
                        if (winnerIndex !== playerIndex) return sum;
                        return sum + (this.players[winnerIndex].marks[target] || 0);
                    }, 0);

                    const displayHits = Math.max(totalClosedMarks, player.turnDarts || 0);
                    if (displayHits > 4) return `${player.name}: ${displayHits} hits`;
                    return '';
                },

                /**
                 * Helper placeholder for Cricket scores. Points in Cricket are permanently accumulated
                 * on each valid hit in hitCricket() and restored directly via undo snapshots.
                 */
                recalcCricketScores() {
                    // Points are accumulated incrementally on each valid dart hit and preserved
                    // in undo snapshots so scores are never wiped out when opponents close targets.
                },

                /**
                 * Records a hit on a Cricket target for the active player.
                 * Enforces:
                 * 1. Closed-for-game check: If all players have closed the number, no points can be scored.
                 *    The click does NOT count as a dart and displays an alert in red font above UNDO and ENTER.
                 * 2. Turn darts limit check: A player cannot exceed 3 darts per turn.
                 * 3. Valid hit: Saves undo state, increments marks and turn darts.
                 * 4. Point Scoring: If at least one opponent has not closed the target (< 3 marks),
                 *    extra marks beyond 3 score points immediately. Points are never wiped out unless UNDO is pressed.
                 */
                hitCricket(playerIndex, target, multiplier) {
                    const p = this.players[playerIndex];
                    if (!p) return;

                    const otherPlayers = this.players.filter((_, idx) => idx !== playerIndex);
                    // In 3-Way Cricket, when a player has closed a number target, other players can NOT score on that target.
                    // Therefore, active player can only score points if NO other player has closed it (all opponents < 3 marks).
                    // In Standard 2-player Cricket, player scores if the opponent has < 3 marks.
                    // Only the first user to close a target can get extra points,
                    // and only while ALL other users do not have that target closed.
                    const canScore = otherPlayers.every((opp) => (opp.marks[target] || 0) < 3);

                    // 1. Closed target check:
                    // A target click cannot score points or add marks if:
                    // a) Every player in the match has at least 3 marks on this target (closed for the game), OR
                    // b) The active player already has >= 3 marks AND cannot score points on it
                    //    (e.g. in 3-Way Cricket another player has closed it).
                    // Instead of counting this click as a dart, notify the player above UNDO/ENTER in red font.
                    const isClosedForGame = this.players.length > 0 && this.players.every((player) => (player.marks[target] || 0) >= 3);
                    const isClosedForActivePlayer = (p.marks[target] || 0) >= 3 && !canScore;

                    if (isClosedForGame || isClosedForActivePlayer) {
                        this.cricketHitLimitMessage = `${target} is already closed, select UNDO or ENTER or another number to continue`;
                        return;
                    }

                    // 2. Turn darts limit check:
                    // A player can throw a maximum of 3 darts per turn.
                    if ((p.turnDarts || 0) >= 3) {
                        this.cricketHitLimitMessage = '3 dart hits recorded, click on UNDO or ENTER to continue';
                        return;
                    }

                    // 3. Valid dart hit:
                    // Clear previous warning message and save undo state
                    this.cricketHitLimitMessage = '';
                    this.saveUndoState();

                    const prevMarks = p.marks[target] || 0;
                    const newMarks = prevMarks + multiplier;
                    p.marks[target] = newMarks;
                    p.turnDarts = (p.turnDarts || 0) + 1;
                    this.cricketTurnMarks[target] = true;

                    // Record button clicked in Cricket "Score for round" text box:
                    // T# for Triple, D# for Double, # for Single
                    const hitToken = multiplier === 3 ? `T${target}` : (multiplier === 2 ? `D${target}` : `${target}`);
                    this.cricketRoundInput = this.cricketRoundInput ? `${this.cricketRoundInput} ${hitToken}` : hitToken;

                    // 4. Scoring logic (for ALL Cricket games):
                    // In Cricket, a player scores points for any marks earned beyond 3 IF scoring is permitted:
                    // - Standard Cricket: At least one opponent has not yet closed the target (< 3 marks).
                    // - 3-Way Cricket: When a player has closed a target, other players can NOT score on that target
                    //   (a player can only score points on extra hits if no other player has closed it).
                    // Once earned, points are permanently kept and NEVER wiped out when an opponent closes
                    // the target later. Scores are only rolled back when UNDO is clicked.
                    if (canScore) {
                        const prevScoringMarks = Math.max(0, prevMarks - 3);
                        const newScoringMarks = Math.max(0, newMarks - 3);
                        const newlyScoredMarks = newScoringMarks - prevScoringMarks;
                        if (newlyScoredMarks > 0) {
                            const targetValue = target === 'B' ? 25 : Number(target);
                            p.cricketScore = (Number(p.cricketScore) || 0) + (newlyScoredMarks * targetValue);
                            this.triggerScoreFlash(playerIndex);
                        }
                    }
                },

                /** Records a missed dart in Cricket */
                missCricket() {
                    this.submitCricketTurn();
                },

                /**
                 * Submits the active player's Cricket turn.
                 * Saves undo state, clears messages, clears round input, resets turn darts, and advances to the next player.
                 */
                submitCricketTurn() {
                    this.saveUndoState();
                    this.clearScoreFlash();
                    this.cricketRoundInput = '';
                    this.cricketTurnMarks = {};
                    this.cricketHitLimitMessage = '';
                    const current = this.players[this.activePlayer];
                    if (current) current.turnDarts = 0;

                    // Cricket win condition: all targets closed AND score >= all other players
                    const cricketTargets = [20, 19, 18, 17, 16, 15, 'B'];
                    const allClosed = cricketTargets.every(t => (current.marks[t] || 0) >= 3);
                    if (allClosed) {
                        const currentScore = Number(current.cricketScore) || 0;
                        const allOthersLowerOrEqual = this.players.every((p, idx) =>
                            idx === this.activePlayer || (Number(p.cricketScore) || 0) <= currentScore
                        );
                        if (allOthersLowerOrEqual) {
                            this.winMessage = `${current.name} WINS THE MATCH! Click New Match to start a new game.`;
                            this.isGameOver = true;
                            this.saveUndoStateSnapshot();
                            return;
                        }
                    }

                    this.activePlayer = (this.activePlayer + 1) % this.players.length;
                },

                /* ------------------------------------------------------------------
                   GEOMETRIC DARTBOARD SEGMENTS (Helper utilities for board graphics)
                   ------------------------------------------------------------------ */
                /** Converts polar coordinates (angle & radius) to Cartesian (x, y) */
                polarToCartesian(cx, cy, radius, angleDeg) {
                    const radians = (angleDeg - 90) * (Math.PI / 180);
                    return {
                        x: cx + radius * Math.cos(radians),
                        y: cy + radius * Math.sin(radians)
                    };
                },

                /** Generates SVG path string for an annular ring segment */
                describeRingSegment(cx, cy, innerR, outerR, startDeg, endDeg) {
                    const startOuter = this.polarToCartesian(cx, cy, outerR, startDeg);
                    const endOuter = this.polarToCartesian(cx, cy, outerR, endDeg);
                    const startInner = this.polarToCartesian(cx, cy, innerR, startDeg);
                    const endInner = this.polarToCartesian(cx, cy, innerR, endDeg);
                    return [
                        `M ${startOuter.x} ${startOuter.y}`,
                        `L ${endOuter.x} ${endOuter.y}`,
                        `L ${endInner.x} ${endInner.y}`,
                        `L ${startInner.x} ${startInner.y}`,
                        'Z'
                    ].join(' ');
                },

                /** Returns geometry descriptors for standard 20-segment dartboard */
                getDartboardSegments() {
                    const numbers = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
                    const cx = 210;
                    const cy = 210;
                    return numbers.map((value, index) => {
                        const startDeg = index * 18;
                        const endDeg = startDeg + 18;
                        const midDeg = (startDeg + endDeg) / 2;
                        const labelPos = this.polarToCartesian(cx, cy, 76, midDeg);
                        return {
                            value,
                            startDeg,
                            endDeg,
                            singlePath: this.describeRingSegment(cx, cy, 32, 66, startDeg, endDeg),
                            triplePath: this.describeRingSegment(cx, cy, 66, 83, startDeg, endDeg),
                            doublePath: this.describeRingSegment(cx, cy, 118, 138, startDeg, endDeg),
                            labelX: labelPos.x,
                            labelY: labelPos.y
                        };
                    });
                }
            };
        }
    </script>
